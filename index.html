    try {

      };
      
      // Mengubah Teks menjadi Data URL (Bypass blokir sistem)
      const manifestUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);

      // 2. Pura-pura mendaftarkan Service Worker agar Syarat Install PWA terpenuhi
      if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', function(e) {});`;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(swUrl).catch(() => {
             // Jika ditolak oleh browser/sistem, matikan diam-diam (tidak ada error di layar)
          });
        });
      }
    } catch (error) {
       // Pelindung mutlak: Jika terjadi error apapun di sini, aplikasi React tetap aman!
    }
  </script>

        const classes = enrollmentsData[uid]?.classes || {};

                    }

        });

                                <button onClick={() => { setLang('id'); setShowLangMenu(false); }} className={`px-4 py-2 text-left text-sm font-bold hover:bg-blue-50 dark:hover:bg-blue-900/20 ${lang === 'id' ? 'text-blue-600' : 'text-slate-700 dark:text-slate-300'}`}>🇮🇩 Indonesia</button>
                                <button onClick={() => { setLang('ar'); setShowLangMenu(false); }} className={`px-4 py-2 text-left text-sm font-bold hover:bg-blue-50 dark:hover:bg-blue-900/20 ${lang === 'ar' ? 'text-blue-600' : 'text-slate-700 dark:text-slate-300'}`}>🇸🇦 العربية</button>
                                <button onClick={() => { setLang('en'); setShowLangMenu(false); }} className={`px-4 py-2 text-left text-sm font-bold hover:bg-blue-50 dark:hover:bg-blue-900/20 ${lang === 'en' ? 'text-blue-600' : 'text-slate-700 dark:text-slate-300'}`}>🇬🇧 English</button>

                </div>

                      <FileSignature size={20} /> Daftar Sekarang
                    </Button>

              </section>

                      </div>
                      <div className="text-center p-2 sm:p-4">

                      </div>
                      <div className="text-center p-2 sm:p-4">
                         <h3 className="text-xl sm:text-3xl md:text-4xl font-black text-slate-900 dark:text-white mb-1 sm:mb-2">{displayMateri}+</h3>
                         <p className="text-[10px] sm:text-sm md:text-base text-slate-500 font-medium">Materi</p>
                      </div>
                   </div>
                </div>
              </section>

                      const IconComp = isBersanad ? Crown : theme.icon;
                      
                      return (
                      <Card key={i} className={`p-4 sm:p-6 transition-transform duration-300 border border-slate-200 dark:border-slate-800 ${theme.borderHover} shadow-sm hover:shadow-lg cursor-pointer bg-white dark:bg-slate-900`} onClick={() => setShowRegModal(true)}>
                         <div className="flex items-start gap-3 sm:gap-4">
                            <div className={`w-12 h-12 sm:w-14 sm:h-14 rounded-xl ${theme.colorClass} flex items-center justify-center shrink-0 shadow-sm`}><IconComp size={24} className="sm:w-7 sm:h-7"/></div>
                            <div className="flex-1">
                               <h3 className="text-base sm:text-lg font-bold mb-1 text-slate-900 dark:text-white flex flex-wrap items-center gap-1.5 sm:gap-2">
                                  {prog.title}
                                  {isBersanad && (
                                     <span className="text-[9px] sm:text-[10px] bg-gradient-to-r from-amber-200 to-amber-400 text-amber-900 px-1.5 sm:px-2 py-0.5 rounded-md font-black tracking-wider flex items-center gap-1 shadow-sm whitespace-nowrap"><Crown size={10} className="sm:w-3 sm:h-3"/> BERSANAD</span>

                               <p className="text-slate-500 text-xs sm:text-sm mb-2 sm:mb-3 leading-relaxed line-clamp-2">{prog.desc}</p>
                               <span className={`${theme.textClass} text-[11px] sm:text-xs font-bold flex items-center gap-1 group w-max`}>

                            </div>

                    </div>

                       {[
                         { step: 1, title: 'Isi Formulir', desc: 'Klik tombol Daftar Sekarang dan isi data diri Anda.', icon: FileSignature, iconColor: 'text-blue-600', badgeColor: 'bg-blue-500' },

                         { step: 4, title: 'Mulai Belajar', desc: 'Login menggunakan Nama dan Token Anda untuk akses kelas.', icon: PlayCircle, iconColor: 'text-orange-600', badgeColor: 'bg-orange-500' }
                       ].map((s, i) => (
                          <div key={i} className="relative z-10 flex flex-col items-center group">
                             <div className={`w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white dark:bg-slate-900 ${s.iconColor} font-black flex items-center justify-center mb-4 sm:mb-6 shadow-xl border-4 border-slate-50 dark:border-slate-800 transition-transform duration-300`}>
                                <s.icon size={28} className="sm:w-9 sm:h-9" strokeWidth={1.5} />
                             </div>
                             <div className={`absolute top-0 right-1/2 translate-x-10 sm:translate-x-0 sm:right-auto md:-top-3 md:-right-3 w-6 h-6 sm:w-8 sm:h-8 rounded-full ${s.badgeColor} text-white flex items-center justify-center text-xs sm:text-sm font-bold shadow-md ring-4 ring-white dark:ring-slate-900`}>
                                {s.step}
                             </div>
                             <h3 className="text-lg sm:text-xl font-bold mb-2 sm:mb-3 text-slate-900 dark:text-white">{s.title}</h3>
                             <p className="text-slate-500 text-xs sm:text-sm max-w-[220px] mx-auto leading-relaxed">{s.desc}</p>
                             
                             {i < 3 && <div className="block md:hidden mt-6 text-slate-200 dark:text-slate-800"><ArrowDown size={24} className="sm:w-8 sm:h-8" /></div>}
                          </div>
                       ))}
                    </div>
                 </div>
              </section>

        const [isProcessing, setIsProcessing] = useState(false);
        const [regToReject, setRegToReject] = useState(null);
        const pendingList = Object.entries(registrations || {}).map(([id, data]) => ({ id, ...data })).sort((a,b) => b.timestamp - a.timestamp);

        const generateToken = () => {
             const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let result = 'RBA';
             for (let i = 0; i < 5; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
             return result;
        };

        const handleReject = (regId) => {
            setRegToReject(regId);
        };

        const executeReject = async () => {
            if(!regToReject) return;
            setIsProcessing(true);
            try {
                await updateDoc(doc(db, "rba_lms", "main_db"), {
                    [`registrations.${regToReject}`]: deleteField()
                });
                setRegToReject(null);
            } catch (error) { console.error("Gagal menolak", error); }
            setIsProcessing(false);
        };

        const handleApprove = async (regId, regData) => {
            setIsProcessing(true);
            try {
                const newToken = generateToken();
                const newUserData = {
                    role: 'siswa',
                    name: regData.nama,
                    used: false,
                    createdAt: Date.now()
                };

                await updateDoc(doc(db, "rba_lms", "main_db"), {
                    [`users.${newToken}`]: newUserData,
                    [`registrations.${regId}`]: deleteField()
                });

                let waNumber = regData.wa.replace(/\D/g, '');
                if(waNumber.startsWith('0')) waNumber = '62' + waNumber.substring(1);
                
                const textWa = `*KARTU AKSES RUMAH BAHASA ARAB* 🎓\n\nAssalamu'alaikum, Kak ${regData.nama}.\n\nAlhamdulillah, pendaftaran Anda untuk program *${regData.program}* telah kami verifikasi. Akses kelas Anda resmi diterbitkan!\n\n🔑 *Token (PIN):* *${newToken}*\n\n*Cara Masuk:*\n1. Buka tautan Rumah Bahasa Arab.\n2. Klik tombol "Masuk".\n3. Ketikkan Nama dan Token (PIN) di atas secara persis huruf besarnya.\n\nSelamat belajar di Rumah Bahasa Arab!`;
                
                window.open(`https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(textWa)}`, '_blank');

            } catch (error) { 
                console.error("Gagal approve", error); 
                alert("Gagal menyetujui. Pastikan koneksi internet stabil.");

            setIsProcessing(false);

                                        </div>
                                    )}
                                    {reg.buktiUrl && (

                                            <Maximize size={32} className="text-white" />

                     const totalModules = (course.modules || []).length;
                     const completedModules = enrollmentsData?.[uid]?.progress?.[course.id] || [];
                     const realProgress = totalModules === 0 ? 0 : Math.round((completedModules.length / totalModules) * 100);
                     const isFinished = realProgress === 100 && totalModules > 0;

                     return (
                     <Card key={i} className={`p-4 sm:p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sm:gap-6 border-l-4 ${isFinished ? 'border-l-amber-400' : 'border-l-orange-500'}`}>
                        <div className="flex items-center gap-3 sm:gap-4 w-full md:w-auto">
                           <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shrink-0 ${isFinished ? 'bg-amber-100 text-amber-500' : 'bg-orange-100 text-orange-600 dark:bg-orange-900/30'}`}>
                              {isPending ? <Clock size={20} className="sm:w-6 sm:h-6"/> : (isFinished ? <Trophy size={20} className="sm:w-6 sm:h-6"/> : <CheckCircle size={20} className="sm:w-6 sm:h-6"/>)}
                           </div>
                           <div className="flex-1 min-w-0">
                              <h3 className="font-bold text-base sm:text-lg text-slate-900 dark:text-white leading-tight truncate">{course.title}</h3>
                              {isPending ? (
                                 <p className="text-[10px] sm:text-sm font-bold text-amber-500 mt-1">Menunggu Konfirmasi Admin</p>
                              ) : (
                                 <div className="mt-1.5 sm:mt-2 w-full md:w-56">
                                    <div className="flex justify-between text-[10px] sm:text-xs font-bold text-slate-500 mb-1 sm:mb-1.5">
                                       <span>Progres ({completedModules.length}/{totalModules})</span><span className={isFinished ? 'text-amber-500' : ''}>{realProgress}%</span>
                                    </div>
                                    <ProgressBar progress={realProgress} color={isFinished ? 'bg-amber-400' : 'bg-orange-500'} className="h-1 sm:h-1.5" />
                                 </div>
                              )}
                           </div>
                        </div>
                        
                        {!isPending && (
                           <div className="flex gap-2 w-full md:w-auto">
                               {isFinished && <Button size="sm" onClick={() => onShowSertifikat(course)} className="flex-1 md:flex-none bg-gradient-to-r from-amber-400 to-amber-500 text-white shadow-amber-500/30 border-none gap-2 text-xs sm:text-sm"><Award size={16}/> Unduh Sertifikat</Button>}
                               <Button size="sm" variant={isFinished ? 'outline' : 'primary'} className={`flex-1 md:flex-none shrink-0 gap-2 text-xs sm:text-sm h-10 sm:h-auto ${isFinished ? '' : 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-none'}`} onClick={() => onGoToClass(course)}>
                                  {isFinished ? 'Ulangi' : 'Lanjut'} <span className="hidden sm:inline">Belajar</span> <ChevronRight size={16}/>
                               </Button>
                           </div>
                        )}
                     </Card>
                     )
                   })}
                 </div>
               )}
            </section>
          </div>
        );
    };
    const ProfilDanRapor = ({ uid, currentUserToken, usersData, enrollmentsData, courses, onShowSertifikat, db }) => {
        const [isUploadingPhoto, setIsUploadingPhoto] = useState(false);
        const userList = Object.entries(usersData).map(([token, data]) => ({ token, ...data }));
        const myUser = userList.find(u => u.token === currentUserToken) || { name: 'Siswa RBA', token: 'UNKNOWN', role: 'siswa', createdAt: Date.now() };
        
        const myEnrollments = enrollmentsData[uid]?.classes || {};
        const myProgress = enrollmentsData[uid]?.progress || {};
        const myCourses = courses.filter(c => myEnrollments[c.id] === 'approved');
        
        let completedCount = 0; let activeCount = 0; let certificates = []; let courseStats = [];
        const currentXP = calculateUserXP(uid, enrollmentsData, courses);

        myCourses.forEach(c => {
            const totalModules = (c.modules || []).length;
            const completedModules = myProgress[c.id] || [];
            const realProgress = totalModules === 0 ? 0 : Math.round((completedModules.length / totalModules) * 100);
            
            if (realProgress === 100 && totalModules > 0) { completedCount++; certificates.push(c); } else { activeCount++; }
            courseStats.push({ ...c, progress: realProgress, completedMods: completedModules.length, totalMods: totalModules });
        });

        const handlePhotoUpload = async (e) => {
            const file = e.target.files[0];
            if (!file || !db) return;
            
            if (file.size > 2 * 1024 * 1024) {
                alert("Ukuran foto terlalu besar. Maksimal 2MB.");
                e.target.value = null;
                return;
            }

            setIsUploadingPhoto(true);
            try {
                // Kompresi foto sebelum disimpan agar database tidak berat
                const compressedUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width; 
                            let height = img.height;
                            const maxDim = 300; // Ukuran optimal untuk foto profil
                            
                            if (width > height && width > maxDim) { 
                                height *= maxDim / width; width = maxDim; 
                            } else if (height > maxDim) { 
                                width *= maxDim / height; height = maxDim; 
                            }
                            
                            canvas.width = width; 
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            resolve(canvas.toDataURL('image/jpeg', 0.6)); // Kualitas 60%
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });

                await updateDoc(doc(db, "rba_lms", "main_db"), {
                    [`users.${currentUserToken}.photoUrl`]: compressedUrl
                });
            } catch (err) {
                console.error("Gagal upload foto:", err);
            }
            setIsUploadingPhoto(false);
        };

        return (
            <div className="p-4 md:p-6 lg:p-8 w-full max-w-5xl mx-auto space-y-6 lg:space-y-8 animate-slide-up pb-24 overflow-x-hidden">
                <div className="mb-2 flex flex-col sm:flex-row justify-between sm:items-end">
                    <div>
                        <Badge variant="orange" className="mb-3 text-[10px]">PUSAT INFORMASI SANTRI</Badge>
                        <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white leading-tight">Profil & Rapor Belajar</h1>
                        <p className="text-sm text-slate-500 mt-1">Pantau seluruh pencapaian dan koleksi sertifikat Anda di sini.</p>
                    </div>
                </div>

                <Card className="p-0 overflow-hidden border-2 border-slate-200 dark:border-slate-800 bg-gradient-to-br from-white to-orange-50 dark:from-slate-900 dark:to-slate-900/50 shadow-sm relative">
                    <div className="absolute top-0 right-0 w-48 h-48 bg-orange-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 translate-x-10 -translate-y-10"></div>
                    <div className="p-6 md:p-8 flex flex-col md:flex-row items-center md:items-start gap-6 relative z-10">
                        <div className="w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-gradient-to-tr from-orange-500 to-amber-400 p-1 shrink-0 shadow-lg shadow-orange-500/20 relative">
                            <div className="w-full h-full rounded-full bg-white dark:bg-slate-900 flex items-center justify-center text-4xl font-black text-orange-500 overflow-hidden relative group">
                                {myUser.photoUrl ? (
                                    <img src={myUser.photoUrl} alt="Profil" className="w-full h-full object-cover" />
                                ) : (
                                    myUser.name.charAt(0).toUpperCase()
                                )}
                                
                                <label className="absolute inset-0 bg-black/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer text-white">
                                    {isUploadingPhoto ? <Loader2 className="animate-spin w-6 h-6" /> : <Camera className="w-6 h-6" />}
                                    <input type="file" accept="image/jpeg, image/png, image/webp" className="hidden" onChange={handlePhotoUpload} disabled={isUploadingPhoto} />
                                </label>
                            </div>
                            <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-black px-3 py-1 rounded-full flex items-center gap-1 shadow-md border border-slate-700 whitespace-nowrap">
                                <Zap size={10} className="text-amber-400"/> {currentXP} XP
                            </div>
                        </div>
                        <div className="text-center md:text-left flex-1 w-full mt-2 md:mt-0">
                            <div className="flex flex-col md:flex-row md:items-center gap-3 mb-2 justify-center md:justify-start">
                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white truncate">{myUser.name}</h2>
                                <Badge variant="gold" className="uppercase mx-auto md:mx-0 w-max">{myUser.role}</Badge>
                            </div>
                            <div className="flex items-center justify-center md:justify-start gap-2 mb-6">
                                <Key size={14} className="text-slate-400"/>
                                <p className="text-sm font-mono font-bold text-slate-600 dark:text-slate-400 tracking-widest">{myUser.token}</p>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-2 sm:gap-4 md:max-w-md">
                                <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-center">
                                    <h4 className="text-xl sm:text-2xl font-black text-orange-600">{myCourses.length}</h4>
                                    <p className="text-[9px] sm:text-[10px] font-bold text-slate-500 uppercase mt-1">Total Kelas</p>
                                </div>
                                <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-center">
                                    <h4 className="text-xl sm:text-2xl font-black text-blue-600">{activeCount}</h4>
                                    <p className="text-[9px] sm:text-[10px] font-bold text-slate-500 uppercase mt-1">Sedang Aktif</p>
                                </div>
                                <div className="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-center">
                                    <h4 className="text-xl sm:text-2xl font-black text-emerald-600">{completedCount}</h4>
                                    <p className="text-[9px] sm:text-[10px] font-bold text-slate-500 uppercase mt-1">Telah Lulus</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </Card>

                <div className="space-y-4">
                    <h3 className="text-lg font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <TrendingUp size={20} className="text-blue-500"/> Rapor Progres Belajar
                    </h3>
                    {courseStats.length === 0 ? (
                        <div className="text-center py-10 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 text-slate-500 text-sm">Belum ada kelas yang disetujui.</div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {courseStats.map((cs, i) => (
                                <Card key={i} className="p-4 sm:p-5 border border-slate-200 dark:border-slate-700 hover:shadow-md transition-shadow">
                                    <div className="flex justify-between items-start mb-3">
                                        <h4 className="font-bold text-slate-900 dark:text-white line-clamp-1 pr-2" title={cs.title}>{cs.title}</h4>
                                        <Badge variant={cs.progress === 100 ? 'emerald' : 'blue'} className="!text-[9px] shrink-0">
                                            {cs.progress === 100 ? 'LULUS' : 'PROSES'}
                                        </Badge>
                                    </div>
                                    <div className="flex justify-between items-end mb-2">
                                        <span className="text-xs font-bold text-slate-500">{cs.completedMods} dari {cs.totalMods} Materi</span>
                                        <span className={`text-sm font-black ${cs.progress === 100 ? 'text-emerald-500' : 'text-blue-600'}`}>{cs.progress}%</span>
                                    </div>
                                    <ProgressBar progress={cs.progress} color={cs.progress === 100 ? 'bg-emerald-500' : 'bg-blue-500'} className="h-1.5" />
                                </Card>
                            ))}
                        </div>
                    )}
                </div>

                <div className="space-y-4 pt-4">
                    <h3 className="text-lg font-bold flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                        <Award size={20} className="text-amber-500"/> Etalase Sertifikat Kelulusan
                    </h3>
                    {certificates.length === 0 ? (
                        <div className="text-center py-12 bg-amber-50 dark:bg-amber-900/10 rounded-2xl border border-dashed border-amber-200 dark:border-amber-800">
                            <div className="w-16 h-16 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm"><Award size={32} className="text-amber-300"/></div>
                            <p className="text-sm font-bold text-amber-700 dark:text-amber-500">Belum Ada Sertifikat</p>
                            <p className="text-xs text-amber-600 dark:text-amber-400 mt-1">Selesaikan kelas hingga 100% untuk mendapatkan sertifikat resmi.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                            {certificates.map((cert, i) => (
                                <Card key={i} className="p-0 overflow-hidden border border-slate-200 dark:border-slate-700 group hover:-translate-y-1 hover:shadow-xl transition-all duration-300">
                                    <div className="bg-slate-900 aspect-[1.4/1] relative p-4 flex flex-col items-center justify-center text-center border-b-4 border-amber-500">
                                        <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(#fff 1px, transparent 1px)', backgroundSize: '10px 10px' }}></div>
                                        <Crown size={32} className="text-amber-400 mb-2 relative z-10"/>
                                        <h4 className="text-white font-serif text-sm font-bold relative z-10">RBA SERTIFIKAT</h4>
                                        <p className="text-amber-200 text-[10px] uppercase tracking-widest relative z-10 mt-2">Lulusan Resmi</p>
                                    </div>
                                    <div className="p-4 bg-white dark:bg-slate-800">
                                        <h5 className="font-bold text-xs sm:text-sm text-slate-900 dark:text-white line-clamp-2 mb-4 leading-tight min-h-[36px]">{cert.title}</h5>
                                        <Button size="sm" onClick={() => onShowSertifikat(cert)} className="w-full bg-amber-500 hover:bg-amber-600 text-white shadow-amber-500/20 border-none gap-2 text-xs">
                                            <Printer size={14}/> Buka & Cetak
                                        </Button>
                                    </div>
                                </Card>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const JadwalAkademik = ({ schedules = [], role, db }) => {
        const [showModal, setShowModal] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [form, setForm] = useState({ id: '', title: '', datetime: '', desc: '', link: '' });

        const sortedSchedules = [...schedules].sort((a,b) => new Date(a.datetime).getTime() - new Date(b.datetime).getTime());
        const now = new Date().getTime();
        const upcoming = sortedSchedules.filter(s => new Date(s.datetime).getTime() > now - 3600000); 
        const past = sortedSchedules.filter(s => new Date(s.datetime).getTime() <= now - 3600000).reverse().slice(0, 5); 

        const handleSave = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);
            try {
                let updated;
                if (form.id) {
                    updated = schedules.map(s => s.id === form.id ? form : s);
                } else {
                    const newSchedule = { id: 'sch_' + Date.now().toString(36), ...form };
                    updated = [...schedules, newSchedule];
                }
                await setDoc(doc(db, "rba_lms", "main_db"), { schedules: updated }, { merge: true });
                setShowModal(false);
                setForm({ id: '', title: '', datetime: '', desc: '', link: '' });
            } catch(e) { console.error("Gagal simpan jadwal:", e); }
            setIsSubmitting(false);
        };

        const handleDelete = async (id) => {
            if(!window.confirm('Hapus jadwal ini?')) return;
            const updated = schedules.filter(s => s.id !== id);
            try { await setDoc(doc(db, "rba_lms", "main_db"), { schedules: updated }, { merge: true }); } 
            catch(e) { console.error("Gagal hapus:", e); }
        };

        const handleEditClick = (sch) => {
            setForm(sch);
            setShowModal(true);
        };

        const handleAddClick = () => {
            setForm({ id: '', title: '', datetime: '', desc: '', link: '' });
            setShowModal(true);
        };

        const ScheduleCard = ({ sch, isPast }) => (
            <Card className={`p-5 flex flex-col justify-between border-l-4 ${isPast ? 'border-l-slate-400 opacity-90 bg-slate-50 dark:bg-slate-900/50' : 'border-l-indigo-500 hover:shadow-md'} transition-all`}>
                <div>
                    <div className="flex justify-between items-start mb-3">
                        <div className="flex gap-2">
                            <Badge variant={isPast ? 'slate' : 'purple'} className="!text-[10px]"><Calendar size={12} className="mr-1"/> {new Date(sch.datetime).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'})}</Badge>
                            <Badge variant={isPast ? 'slate' : 'blue'} className="!text-[10px]"><Clock size={12} className="mr-1"/> {new Date(sch.datetime).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</Badge>
                        </div>
                        {(role === 'admin' || role === 'guru') && (
                            <div className="flex gap-1 relative z-10">
                                <button onClick={() => handleEditClick(sch)} className="p-1.5 text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-colors" title="Edit Jadwal"><PenTool size={14}/></button>
                                <button onClick={() => handleDelete(sch.id)} className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-colors" title="Hapus Jadwal"><Trash2 size={14}/></button>
                            </div>
                        )}
                    </div>
                    <h3 className="font-bold text-lg text-slate-900 dark:text-white mb-2">{sch.title}</h3>
                    <p className="text-sm text-slate-500 mb-4 leading-relaxed">{sch.desc}</p>
                </div>
                <Button size="sm" className={`w-full gap-2 border-none ${isPast ? 'bg-slate-200 text-slate-500 cursor-not-allowed shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-500/20'}`} onClick={() => !isPast && window.open(sch.link, '_blank')} disabled={isPast}>
                    <VideoIcon size={16}/> {isPast ? 'Sesi Berakhir' : 'Gabung Zoom/Meet'}
                </Button>
            </Card>
        );

        return (
            <div className="p-4 md:p-6 lg:p-8 w-full max-w-5xl mx-auto space-y-6 pb-24">
                <div className="flex flex-col sm:flex-row justify-between sm:items-end mb-6 border-b border-slate-200 dark:border-slate-800 pb-4 gap-4">
                    <div>
                        <Badge variant="indigo" className="mb-3 text-[10px] bg-indigo-100 text-indigo-600">SISTEM INFORMASI</Badge>
                        <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">Kalender Akademik</h1>
                        <p className="text-sm text-slate-500 mt-1">Jadwal tatap muka virtual dan kelas interaktif (Live Session).</p>
                    </div>
                    {(role === 'admin' || role === 'guru') && (
                        <Button onClick={handleAddClick} className="gap-2 bg-indigo-600 hover:bg-indigo-700 text-white border-none shadow-indigo-500/20"><PlusCircle size={18}/> Tambah Jadwal Baru</Button>
                    )}
                </div>

                <div className="space-y-4">
                    <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2"><CalendarDays size={20} className="text-indigo-500"/> Jadwal Mendatang</h2>
                    {upcoming.length === 0 ? (
                        <div className="text-center py-12 bg-slate-50 dark:bg-slate-900 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl text-slate-500">
                            <VideoIcon size={48} className="mx-auto text-slate-300 mb-3"/>
                            Belum ada jadwal kelas live (Zoom/Meet) dalam waktu dekat.
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {upcoming.map(sch => <ScheduleCard key={sch.id} sch={sch} isPast={false} />)}
                        </div>
                    )}
                </div>

                {past.length > 0 && (
                    <div className="space-y-4 pt-8">
                        <h2 className="text-lg font-bold text-slate-500 flex items-center gap-2"><History size={20}/> Riwayat Jadwal Selesai</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {past.map(sch => <ScheduleCard key={sch.id} sch={sch} isPast={true} />)}
                        </div>
                    </div>
                )}

                {showModal && (
                   <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                      <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up">
                         <h2 className="text-xl font-bold mb-4">{form.id ? 'Edit Jadwal' : 'Buat Jadwal Baru'}</h2>
                         <form onSubmit={handleSave} className="space-y-4">
                            <div><label className="block text-sm font-bold mb-2">Judul Pertemuan</label><input type="text" required value={form.title} onChange={e=>setForm({...form, title: e.target.value})} placeholder="Contoh: Live Tanya Jawab Nahwu" className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-600 text-sm" /></div>
                            <div><label className="block text-sm font-bold mb-2">Tanggal & Waktu</label><input type="datetime-local" required value={form.datetime} onChange={e=>setForm({...form, datetime: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-600 text-sm" /></div>
                            <div><label className="block text-sm font-bold mb-2">Tautan (Link) Zoom / Meet</label><input type="url" required value={form.link} onChange={e=>setForm({...form, link: e.target.value})} placeholder="https://zoom.us/j/..." className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-600 text-sm" /></div>
                            <div><label className="block text-sm font-bold mb-2">Deskripsi Singkat</label><textarea required rows="2" value={form.desc} onChange={e=>setForm({...form, desc: e.target.value})} placeholder="Agenda pembahasan..." className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-600 text-sm resize-none"></textarea></div>
                            <div className="flex gap-3 pt-4"><Button type="button" variant="ghost" onClick={()=>setShowModal(false)} className="flex-1">Batal</Button><Button type="submit" disabled={isSubmitting} className="flex-1 bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/30 border-none">Simpan Jadwal</Button></div>
                         </form>
                      </div>
                   </div>
                )}
            </div>
        );
    };

    const PapanPeringkat = ({ usersData, enrollments, courses, currentUserUid }) => {
        const studentList = Object.values(usersData)
            .filter(u => u.role === 'siswa' && u.name)
            .map(u => ({ uid: u.uid, name: u.name, token: u.token, xp: calculateUserXP(u.uid, enrollments, courses) }))
            .sort((a, b) => b.xp - a.xp);

        const getMedalColor = (index) => {
            if(index === 0) return 'text-amber-400 fill-amber-400';
            if(index === 1) return 'text-slate-300 fill-slate-300';
            if(index === 2) return 'text-orange-700 fill-orange-700';
            return 'text-slate-400';
        };

        const getBgColor = (index) => {
            if(index === 0) return 'bg-gradient-to-r from-amber-100 to-amber-50 border-amber-200';
            if(index === 1) return 'bg-gradient-to-r from-slate-100 to-slate-50 border-slate-200';
            if(index === 2) return 'bg-gradient-to-r from-orange-100 to-orange-50 border-orange-200';
            return 'bg-white border-slate-100';
        };

        return (
            <div className="p-4 md:p-6 lg:p-8 w-full max-w-4xl mx-auto space-y-6 lg:space-y-8 animate-slide-up pb-24 overflow-x-hidden">
                <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm border border-amber-200"><Trophy size={32} className="text-amber-500"/></div>
                    <h1 className="text-2xl sm:text-3xl lg:text-4xl font-black text-slate-900 dark:text-white leading-tight mb-2">Papan Peringkat Santri</h1>
                    <p className="text-sm text-slate-500 max-w-lg mx-auto">Selesaikan materi, kuis, dan praktik untuk mendapatkan XP. Jadilah santri terbaik RBA!</p>
                </div>

                <div className="space-y-3">
                    {studentList.length === 0 ? (
                        <div className="text-center py-10 text-slate-500 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">Belum ada data peringkat santri.</div>
                    ) : (
                        studentList.map((student, index) => {
                            const isMe = student.uid === currentUserUid;
                            return (
                            <div key={student.uid} className={`flex items-center justify-between p-4 rounded-2xl border ${getBgColor(index)} ${isMe ? 'ring-2 ring-blue-500 shadow-md' : 'shadow-sm'} transition-transform hover:-translate-y-0.5`}>
                                <div className="flex items-center gap-4">
                                    <div className="w-10 sm:w-12 text-center shrink-0">
                                        {index < 3 ? <Medal size={28} className={`mx-auto ${getMedalColor(index)}`} /> : <span className="text-lg sm:text-xl font-black text-slate-400">#{index + 1}</span>}
                                    </div>
                                    <div className="w-10 h-10 sm:w-12 sm:h-12 bg-slate-900 text-white rounded-full flex items-center justify-center font-bold text-sm sm:text-lg shrink-0 border-2 border-white/50 shadow-inner">
                                        {student.name.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <h3 className={`font-bold text-base sm:text-lg ${isMe ? 'text-blue-700' : 'text-slate-900'}`}>{student.name} {isMe && <Badge variant="blue" className="!text-[9px] ml-1">SAYA</Badge>}</h3>
                                        <p className="text-xs text-slate-500 font-mono mt-0.5">{student.token}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <span className="text-lg sm:text-xl font-black text-slate-900 flex items-center gap-1">{student.xp} <Zap size={16} className="text-amber-500 fill-amber-500"/></span>
                                    <p className="text-[10px] sm:text-xs text-slate-500 font-bold uppercase tracking-wider">Total XP</p>
                                </div>
                            </div>
                        )})
                    )}
                </div>
            </div>
        );
    };

    const ManajemenPenggunaAdmin = ({ usersData, enrollments, courses }) => {
      const dbInstance = db;
      const [searchTerm, setSearchTerm] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);
      const [showBulkModal, setShowBulkModal] = useState(false);
      const [bulkCount, setBulkCount] = useState(10);
      const [bulkRole, setBulkRole] = useState('siswa');
      const [showDelModal, setShowDelModal] = useState(null);
      const [showEditModal, setShowEditModal] = useState(null);
      const [showShareModal, setShowShareModal] = useState(null);

      const [newToken, setNewToken] = useState('');
      const [roleFilter, setRoleFilter] = useState('Semua');
      const [newRole, setNewRole] = useState('siswa');
      const [newNama, setNewNama] = useState('');
      const [editRole, setEditRole] = useState('siswa');
      const [editNama, setEditNama] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const usersList = Object.entries(usersData).map(([token, data]) => ({ token, ...data }));
      const filteredUsers = usersList.filter(u => {
          const matchSearch = u.token.toLowerCase().includes(searchTerm.toLowerCase()) || (u.name && u.name.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchRole = roleFilter === 'Semua' ? true : u.role === roleFilter;
          return matchSearch && matchRole;
      });

      const generateRandomToken = () => {
         const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let result = 'RBA';
         for (let i = 0; i < 5; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
         setNewToken(result);
      };

      const handleSendWa = (user) => {
         const text = `*KARTU AKSES RUMAH BAHASA ARAB* 🎓\n\nAssalamu'alaikum, ${user.name || 'Calon Peserta'}.\n\nAkses masuk kelas pembelajaran Anda telah resmi diterbitkan. Harap simpan informasi rahasia ini:\n\n👤 *Nama:* ${user.name || '-'}\n🔑 *Token (PIN):* *${user.token}*\n🔰 *Status:* ${user.role.toUpperCase()}\n\n*Cara Masuk:*\n1. Buka tautan website Rumah Bahasa Arab.\n2. Klik tombol "Masuk" di pojok kanan.\n3. Ketikkan Nama dan Token (PIN) di atas secara presisi (huruf besar/kecil berpengaruh).\n\n_Mohon untuk tidak membagikan Token ini kepada pihak lain demi keamanan akun Anda._\n\nSelamat belajar!`;
         
         const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
         window.open(whatsappUrl, '_blank');
      };

      const handleExportCSV = () => {
          const studentList = Object.values(usersData).filter(u => u.role === 'siswa');
          let csvContent = "Nama,Token,Role,Total Kelas Aktif,Total Kelas Lulus,Total XP\n";
          
          studentList.forEach(student => {
              const uid = student.uid;
              const xp = calculateUserXP(uid, enrollments, courses);
              
              let activeCount = 0; let completedCount = 0;
              const myEnrollments = enrollments[uid]?.classes || {};
              const myProgress = enrollments[uid]?.progress || {};
              
              courses.forEach(c => {
                  if (myEnrollments[c.id] === 'approved') {
                      const totalModules = (c.modules || []).length;
                      const completedModules = myProgress[c.id] || [];
                      if (totalModules > 0 && completedModules.length === totalModules) { completedCount++; } else { activeCount++; }
                  }
              });
              
              const name = student.name ? `"${student.name}"` : "Belum Ada Nama";
              csvContent += `${name},${student.token},${student.role},${activeCount},${completedCount},${xp}\n`;
          });
          
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", `Rekap_Nilai_Siswa_RBA_${new Date().toLocaleDateString('id-ID')}.csv`);
          document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const handleAddSubmit = async (e) => {
         e.preventDefault(); setErrorMsg(''); setIsSubmitting(true);
         const safeToken = newToken.trim().toUpperCase().replace(/\s+/g, '');
         if (usersData[safeToken]) { setErrorMsg('Token ini sudah terdaftar.'); setIsSubmitting(false); return; }

         const updatedUsers = { ...usersData, [safeToken]: { role: newRole, name: newNama, used: false, createdAt: Date.now() } };
         try {
            await setDoc(doc(dbInstance, "rba_lms", "main_db"), { users: updatedUsers }, { merge: true });
            setShowAddModal(false); setNewToken(''); setNewNama(''); setNewRole('siswa');
         } catch(e) { setErrorMsg('Gagal menyimpan.'); }
         setIsSubmitting(false);
      };

      const handleBulkSubmit = async (e) => {
         e.preventDefault(); 
         setErrorMsg(''); 
         setIsSubmitting(true);
         
         const count = parseInt(bulkCount);
         if (isNaN(count) || count < 1 || count > 50) {
            setErrorMsg('Jumlah token harus antara 1 sampai maksimal 50.');
            setIsSubmitting(false);
            return;
         }

         const newGeneratedUsers = {};
         const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
         let csvContent = "Nama Default,Token,Role\n";

         for (let i = 0; i < count; i++) {
            let token = 'RBA';
            for (let j = 0; j < 5; j++) token += chars.charAt(Math.floor(Math.random() * chars.length));
            
            // Pastikan token belum ada di database maupun di antrean saat ini
            while (usersData[token] || newGeneratedUsers[token]) {
               token = 'RBA';
               for (let j = 0; j < 5; j++) token += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const defaultName = `Peserta Baru ${Math.floor(Math.random() * 9000) + 1000}`;
            newGeneratedUsers[token] = {
               role: bulkRole,
               name: defaultName,
               used: false,
               createdAt: Date.now()
            };
            csvContent += `"${defaultName}",${token},${bulkRole}\n`;
         }

         const updatedUsers = { ...usersData, ...newGeneratedUsers };

         try {
            await setDoc(doc(dbInstance, "rba_lms", "main_db"), { users: updatedUsers }, { merge: true });

            // Download CSV
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Token_Massal_${bulkRole}_${new Date().toLocaleDateString('id-ID')}.csv`);
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);

            setShowBulkModal(false);
            setBulkCount(10);
            setBulkRole('siswa');
         } catch(e) {
            setErrorMsg('Terjadi kesalahan. Gagal menyimpan ke server.');
         }
         setIsSubmitting(false);
      };

      const openEditModal = (user) => { setShowEditModal(user.token); setEditNama(user.name || ''); setEditRole(user.role || 'siswa'); };

      const handleEditSubmit = async (e) => {
         e.preventDefault(); setIsSubmitting(true);
         try { await updateDoc(doc(dbInstance, "rba_lms", "main_db"), { [`users.${showEditModal}.name`]: editNama, [`users.${showEditModal}.role`]: editRole }); setShowEditModal(null); } catch(e) {}
         setIsSubmitting(false);
      };

      const handleDelete = async () => {
         if(!showDelModal) return;
         setIsSubmitting(true);
         try { await updateDoc(doc(dbInstance, "rba_lms", "main_db"), { [`users.${showDelModal}`]: deleteField() }); setShowDelModal(null); } catch(e) {}
         setIsSubmitting(false);
      };

      return (
         <div className="p-4 md:p-6 w-full max-w-7xl mx-auto space-y-6 pb-24">
            <div className="mb-6">
               <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white leading-tight">Manajemen Pengguna</h1>
               <p className="text-slate-500 text-sm mt-1">Kelola token akses, rekap nilai, dan role pengguna sistem.</p>
            </div>

            <div className="flex flex-col md:flex-row gap-4 items-center justify-between bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
               <div className="relative w-full md:max-w-md flex-1">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                  <input type="text" placeholder="Cari token atau nama..." className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm transition-shadow" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
               </div>
               <div className="flex gap-3 w-full md:w-auto overflow-x-auto custom-scrollbar pb-1 md:pb-0">
                   <div className="relative shrink-0 w-36">
                       <Filter className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} />
                       <select value={roleFilter} onChange={e=>setRoleFilter(e.target.value)} className="w-full pl-9 pr-8 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm font-bold text-slate-700 dark:text-slate-300 appearance-none">
                           <option value="Semua">Semua Peran</option>
                           <option value="siswa">Siswa</option>
                           <option value="guru">Guru</option>
                           <option value="admin">Admin</option>
                       </select>
                       <ChevronDown size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                   </div>
                   <Button onClick={handleExportCSV} variant="outline" className="shrink-0 gap-2 text-sm text-emerald-600 border-emerald-300 hover:bg-emerald-50"><FileSpreadsheet size={18}/> Ekspor CSV</Button>
                   <Button onClick={()=>setShowBulkModal(true)} className="shrink-0 gap-2 text-sm bg-purple-600 hover:bg-purple-700 text-white border-none shadow-purple-500/20"><Users size={18}/> Massal</Button>
                   <Button onClick={()=>setShowAddModal(true)} className="shrink-0 gap-2 text-sm border-none"><PlusCircle size={18}/> Token</Button>
               </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
               {filteredUsers.length > 0 ? filteredUsers.map((user, i) => (
                  <Card key={i} className="p-5 flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow border border-slate-200 dark:border-slate-800">
                     <div className="flex justify-between items-start mb-4">
                         <div className="min-w-0 flex-1 pr-3">
                             <div className="flex items-center gap-2 mb-1"><Key size={14} className="text-slate-400" /><h3 className="font-bold text-lg font-mono text-slate-900 dark:text-white truncate">{user.token}</h3></div>
                             <p className="text-sm font-bold text-slate-500 truncate">{user.name || 'Belum Diatur'}</p>
                             <div className="flex items-center gap-1.5 mt-1.5">
                                 <div className={`w-2 h-2 rounded-full ${user.lastActive && (Date.now() - user.lastActive < 86400000) ? 'bg-emerald-500 animate-pulse shadow-[0_0_5px_rgba(16,185,129,0.6)]' : 'bg-slate-300 dark:bg-slate-600'}`}></div>
                                 <p className="text-[10px] text-slate-400 font-medium">
                                     {user.lastActive ? `Login: ${new Date(user.lastActive).toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}` : 'Belum pernah login'}
                                 </p>
                             </div>
                         </div>
                         <Badge variant={user.used ? 'emerald' : 'slate'} className="!text-[10px] shrink-0">{user.used ? 'TERPAKAI' : 'KOSONG'}</Badge>
                     </div>
                     <div className="flex justify-between items-center mt-auto pt-4 border-t border-slate-100 dark:border-slate-800">
                        <Badge variant={user.role === 'admin' ? 'purple' : (user.role === 'guru' ? 'blue' : 'orange')} className="!text-[10px] uppercase">{user.role}</Badge>
                        <div className="flex gap-1">
                           <button onClick={() => setShowShareModal(user)} className="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-lg transition-colors"><Share2 size={16}/></button>
                           <button onClick={() => openEditModal(user)} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-colors"><PenTool size={16}/></button>
                           <button onClick={() => setShowDelModal(user.token)} className="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg transition-colors"><Trash2 size={16}/></button>
                        </div>
                     </div>
                  </Card>
               )) : (
                  <div className="col-span-full py-12 text-center text-slate-500 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
                     <User size={48} className="mx-auto mb-4 opacity-20" /><p>Tidak ada pengguna/token yang ditemukan.</p>
                  </div>
               )}
            </div>
            
            {showShareModal && (
               <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden relative border border-slate-200 dark:border-slate-700 animate-slide-up">
                      <div className="bg-gradient-to-br from-slate-900 via-[#0f172a] to-blue-950 p-6 md:p-8 relative overflow-hidden">
                         <div className="absolute -right-6 -bottom-6 text-white/5 rotate-12"><ShieldCheck size={180}/></div>
                         <div className="flex justify-between items-start relative z-10 mb-8">
                             <div><h2 className="text-xl font-black text-white tracking-tight mb-1">Rumah Bahasa Arab</h2><p className="text-[10px] text-blue-300 font-bold tracking-widest uppercase">Official Access Pass</p></div>
                             <div className="bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20 flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div><span className="text-[10px] font-bold text-white uppercase">{showShareModal.role}</span></div>
                         </div>
                         <div className="relative z-10 bg-white/5 border border-white/10 rounded-2xl p-5 backdrop-blur-sm">
                             <p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Nama Pemilik Akun</p>
                             <h3 className="text-lg font-bold text-white mb-4 truncate">{showShareModal.name || 'Belum Diberi Nama'}</h3>
                             <p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Kunci Token (PIN Rahasia)</p>
                             <div className="flex items-center gap-3"><div className="flex-1 bg-black/30 rounded-xl p-3 border border-white/10"><p className="font-mono text-xl font-black text-amber-400 tracking-widest text-center">{showShareModal.token}</p></div></div>
                         </div>
                      </div>
                      <div className="p-5 md:p-6 bg-white dark:bg-slate-900">
                         <div className="flex gap-3 flex-col sm:flex-row">
                            <Button variant="ghost" onClick={()=>setShowShareModal(null)} className="w-full sm:w-1/3">Tutup</Button>
                            <Button variant="primary" onClick={() => handleSendWa(showShareModal)} className="w-full sm:w-2/3 gap-2 bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/30 border-none"><MessageCircle size={18}/> Buka & Kirim WhatsApp</Button>
                         </div>
                      </div>
                  </div>
               </div>
            )}
            
            {showAddModal && (
               <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up">
                     <h2 className="text-xl font-bold mb-4">Buat Akses Token Baru</h2>
                     <form onSubmit={handleAddSubmit} className="space-y-4">
                        {errorMsg && <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold">{errorMsg}</div>}
                        <div><label className="block text-sm font-bold mb-2">Nama Pengguna (Opsional)</label><input type="text" value={newNama} onChange={e=>setNewNama(e.target.value)} placeholder="Misal: Ahmad Fulan" className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-600 text-sm" /></div>
                        <div><label className="block text-sm font-bold mb-2">Role / Peran</label><select value={newRole} onChange={e=>setNewRole(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-600 text-sm"><option value="siswa">Siswa (Peserta Didik)</option><option value="guru">Guru (Ustadz)</option><option value="admin">Admin</option></select></div>
                        <div><label className="block text-sm font-bold mb-2 flex justify-between">Token Akses (PIN) <button type="button" onClick={generateRandomToken} className="text-blue-600 hover:underline text-xs">Acak Otomatis</button></label><input type="text" required value={newToken} onChange={e=>setNewToken(e.target.value)} placeholder="Ketik atau acak token..." className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-600 text-sm font-mono uppercase" /></div>
                        <div className="flex gap-3 pt-4"><Button type="button" variant="ghost" onClick={()=>setShowAddModal(false)} className="flex-1">Batal</Button><Button type="submit" disabled={isSubmitting} className="flex-1 border-none">Simpan</Button></div>
                     </form>
                  </div>
               </div>
            )}

            {showBulkModal && (
               <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up">
                     <h2 className="text-xl font-bold mb-1 text-slate-900 dark:text-white">Buat Token Massal</h2>
                     <p className="text-xs text-slate-500 mb-4">Sistem akan memproses dan langsung mengunduh file CSV secara otomatis.</p>
                     <form onSubmit={handleBulkSubmit} className="space-y-4">
                        {errorMsg && <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold">{errorMsg}</div>}
                        <div>
                           <label className="block text-sm font-bold mb-2 text-slate-700 dark:text-slate-300">Role / Peran</label>
                           <select value={bulkRole} onChange={e=>setBulkRole(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-purple-600 text-sm">
                              <option value="siswa">Siswa (Peserta Didik)</option>
                              <option value="guru">Guru (Ustadz)</option>
                           </select>
                        </div>
                        <div>
                           <label className="block text-sm font-bold mb-2 text-slate-700 dark:text-slate-300">Jumlah Token (Maksimal 50)</label>
                           <input type="number" required min="1" max="50" value={bulkCount} onChange={e=>setBulkCount(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-purple-600 text-sm" />
                        </div>
                        <div className="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                           <Button type="button" variant="ghost" onClick={() => {setShowBulkModal(false); setErrorMsg('');}} className="flex-1">Batal</Button>
                           <Button type="submit" disabled={isSubmitting} className="flex-1 bg-purple-600 hover:bg-purple-700 text-white shadow-purple-500/30 border-none">
                              {isSubmitting ? 'Memproses...' : 'Generate & Unduh'}
                           </Button>
                        </div>
                     </form>
                  </div>
               </div>
            )}

            {showEditModal && (
               <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up">
                     <h2 className="text-xl font-bold mb-4 text-slate-900 dark:text-white">Edit Data Pengguna</h2>
                     <form onSubmit={handleEditSubmit} className="space-y-4">
                        <div>
                           <label className="block text-sm font-bold mb-2 text-slate-700 dark:text-slate-300">Nama Pengguna</label>
                           <input type="text" value={editNama} onChange={e=>setEditNama(e.target.value)} placeholder="Nama Siswa / Guru" className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm" />
                        </div>
                        <div>
                           <label className="block text-sm font-bold mb-2 text-slate-700 dark:text-slate-300">Role / Peran</label>
                           <select value={editRole} onChange={e=>setEditRole(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm">
                              <option value="siswa">Siswa (Peserta Didik)</option>
                              <option value="guru">Guru (Ustadz)</option>
                              <option value="admin">Admin</option>
                           </select>
                        </div>
                        <div className="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                           <Button type="button" variant="ghost" onClick={()=>setShowEditModal(null)} className="flex-1">Batal</Button>
                           <Button type="submit" disabled={isSubmitting} className="flex-1 bg-blue-600 hover:bg-blue-700 shadow-blue-500/30 border-none text-white">Simpan Perubahan</Button>
                        </div>
                     </form>
                  </div>
               </div>
            )}

            {showDelModal && (
               <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up text-center">
                     <div className="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <Trash2 size={32} />
                     </div>
                     <h2 className="text-xl font-bold mb-2 text-slate-900 dark:text-white">Hapus Token Ini?</h2>
                     <p className="text-sm text-slate-500 mb-6 leading-relaxed">Token <strong className="font-mono text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 px-1 rounded">{showDelModal}</strong> akan dihapus secara permanen. Pengguna ini tidak akan bisa login lagi. Lanjutkan?</p>
                     <div className="flex gap-3">
                        <Button type="button" variant="ghost" onClick={()=>setShowDelModal(null)} className="flex-1">Batal</Button>
                        <Button type="button" onClick={handleDelete} disabled={isSubmitting} className="flex-1 bg-rose-600 hover:bg-rose-700 shadow-rose-500/30 border-none text-white">Ya, Hapus</Button>
                     </div>
                  </div>
               </div>
            )}
         </div>
      );
    };

    const ManajemenProgramAdmin = ({ courses, db, storage }) => {
      const [view, setView] = useState('list');
      const [formData, setFormData] = useState({ id: '', title: '', desc: '', kategori: "Bahasa Arab", status: 'Draft', coverUrl: '' });
      const [kategoriFilter, setKategoriFilter] = useState('Semua');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadMsg, setUploadMsg] = useState('');
      const [courseToDelete, setCourseToDelete] = useState(null);
      const [draggedItemIdx, setDraggedItemIdx] = useState(null);
      
      const [activeCourse, setActiveCourse] = useState(null);
      const [modulForm, setModulForm] = useState({ id: '', title: '', desc: '', type: 'youtube', url: '', questions: [] });
      const [isModulFormOpen, setIsModulFormOpen] = useState(false);
      const [isGeneratingAI, setIsGeneratingAI] = useState(false);
      
      const [showApiModal, setShowApiModal] = useState(false);
      const [apiKeyInput, setApiKeyInput] = useState('');
      const [modulToDelete, setModulToDelete] = useState(null);

      const getModulMeta = (type) => {
         switch(type) {
             case 'youtube': return { icon: Youtube, color: 'text-rose-600', label: 'YouTube' };
             case 'video_upload': return { icon: PlayCircle, color: 'text-blue-500', label: 'Video Internal' };
             case 'zoom': return { icon: VideoIcon, color: 'text-indigo-500', label: 'Live Session' };
             case 'pdf': return { icon: FileText, color: 'text-rose-500', label: 'Modul PDF / MPI' };
             case 'kuis': return { icon: FileQuestion, color: 'text-orange-500', label: 'Ujian Kuis / Evaluasi' };
             case 'tugas': return { icon: UploadCloud, color: 'text-purple-500', label: 'Tugas Praktik (Upload)' };
             case 'pemisah': return { icon: FolderOpen, color: 'text-slate-700 dark:text-slate-300', label: 'Pembatas Bab' };
             default: return { icon: Link2, color: 'text-purple-500', label: 'Eksternal' };
         }
      };

      const handleAdd = () => { setFormData({ id: 'crs_' + Date.now().toString(36), title: '', desc: '', kategori: "Bahasa Arab", status: 'Draft', coverUrl: '', modules: [] }); setUploadMsg(''); setView('form'); };
      const handleEdit = (course) => { setFormData(course); setUploadMsg(''); setView('form'); };
      const openModules = (course) => { setActiveCourse(course); setView('modules'); };

      const handleDeleteCourse = async () => {
          if (!courseToDelete) return;
          setIsSubmitting(true);
          try {
              const updatedCourses = courses.filter(c => c.id !== courseToDelete);
              await setDoc(doc(db, "rba_lms", "main_db"), { courses: updatedCourses }, { merge: true });
              setCourseToDelete(null);
          } catch(error) { console.error(error); }
          setIsSubmitting(false);
      };

      const handleDropCourse = async (targetIdx) => {
          if(draggedItemIdx === null || draggedItemIdx === targetIdx) return;
          setIsSubmitting(true);
          try {
              const displayedCourses = courses.filter(c => kategoriFilter === 'Semua' ? true : c.kategori === kategoriFilter);
              const draggedCourse = displayedCourses[draggedItemIdx];
              const targetCourse = displayedCourses[targetIdx];
              
              let updatedCourses = [...courses];
              const realDraggedIdx = updatedCourses.findIndex(c => c.id === draggedCourse.id);
              const realTargetIdx = updatedCourses.findIndex(c => c.id === targetCourse.id);
              
              const [movedItem] = updatedCourses.splice(realDraggedIdx, 1);
              updatedCourses.splice(realTargetIdx, 0, movedItem);
              
              await setDoc(doc(db, "rba_lms", "main_db"), { courses: updatedCourses }, { merge: true });
          } catch(e) { console.error("Gagal menggeser posisi:", e); }
          setDraggedItemIdx(null);
          setIsSubmitting(false);
      };

      const handleImageUpload = async (e) => {
         const file = e.target.files[0];
         if(!file || !storage) return;
         setIsUploading(true); setUploadMsg('Sedang mengunggah gambar...');
         try {
             const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
             const storageRef = ref(storage, `course_covers/${Date.now()}_${safeFileName}`);
             const snapshot = await uploadBytes(storageRef, file);
             const url = await getDownloadURL(snapshot.ref);
             setFormData(prev => ({...prev, coverUrl: url}));
             setUploadMsg('Sukses: Gambar berhasil diunggah! Jangan lupa klik Simpan.');
         } catch (error) { setUploadMsg(`Error: Gagal mengunggah (${error.message}).`); }
         setIsUploading(false);
      };

      const handleMaterialUpload = async (e) => {
         const file = e.target.files[0];
         if(!file || !storage) return;
         setIsUploading(true); setUploadMsg('Mengunggah file ke server...');
         try {
             const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
             const storageRef = ref(storage, `course_materials/${Date.now()}_${safeFileName}`);
             const snapshot = await uploadBytes(storageRef, file);
             const url = await getDownloadURL(snapshot.ref);
             setModulForm(prev => ({...prev, url: url}));
             setUploadMsg('Sukses: Materi diunggah! Klik Simpan.');
         } catch (error) { setUploadMsg(`Error: Gagal mengunggah.`); }
         setIsUploading(false);
      };

      const executeAI = async (apiKey) => {
          setIsGeneratingAI(true);
          setUploadMsg('');
          try {
              const prompt = `Buatkan 3 soal pilihan ganda tingkat lanjut untuk materi dengan judul: "${modulForm.title}". Deskripsi materi: "${modulForm.desc}". Pastikan jawabannya relevan dan akurat. HANYA OUTPUT DALAM FORMAT JSON ARRAY SEPERTI INI TANPA TEKS LAIN: [{"q":"soal","options":["A","B","C","D"],"ans":0}]`;

              const payload = {
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: {
                      responseMimeType: "application/json",
                      responseSchema: {
                          type: "ARRAY",
                          items: {
                              type: "OBJECT",
                              properties: {
                                  q: { type: "STRING" },
                                  options: {
                                      type: "ARRAY",
                                      items: { type: "STRING" },
                                      description: "Harus berisi tepat 4 pilihan jawaban."
                                  },
                                  ans: { type: "INTEGER", description: "Index jawaban yang benar (0, 1, 2, atau 3)" }
                              },
                              propertyOrdering: ["q", "options", "ans"]
                          }
                      }
                  }
              };

              const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
              const response = await fetch(apiUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              });

              if (!response.ok) {
                  throw new Error("API Key salah, ditolak, atau kuota habis.");
              }

              const result = await response.json();
              if (result.candidates && result.candidates.length > 0) {
                  const jsonText = result.candidates[0].content.parts[0].text;
                  let aiQuestions = [];
                  try {
                      aiQuestions = JSON.parse(jsonText);
                  } catch (e) {
                      const match = jsonText.match(/\[.*\]/s);
                      if (match) aiQuestions = JSON.parse(match[0]);
                  }
                  
                  if(Array.isArray(aiQuestions) && aiQuestions.length > 0){
                     setModulForm(prev => ({ ...prev, questions: [...(prev.questions || []), ...aiQuestions] }));
                     setUploadMsg('Sukses: 3 Soal Presisi berhasil diracik oleh AI Google Gemini!');
                  } else {
                     throw new Error("Format AI tidak valid.");
                  }
              } else {
                  throw new Error("Respon AI kosong.");
              }
          } catch (error) {
              console.error("AI Error:", error);
              setUploadMsg(`Error: Gagal memproses AI (${error.message}). Cek koneksi & Kunci API.`);
              if (error.message.includes("API Key") || error.message.includes("salah")) {
                  localStorage.removeItem('rba_ai_key');
              }
          }
          setIsGeneratingAI(false);
      };

      const handleAIGenerate = () => {
          if (!modulForm.title) {
              setUploadMsg('Peringatan: Silakan ketik "Judul" tahapan materi terlebih dahulu agar AI mengenali konteks pelajarannya.');
              return;
          }
          const savedKey = localStorage.getItem('rba_ai_key');
          if (!savedKey) {
              setShowApiModal(true);
              return;
          }
          executeAI(savedKey);
      };

      const handleSave = async (e) => {
         e.preventDefault(); setIsSubmitting(true);
         try {
             let updatedCourses = [...courses];
             const existingIdx = updatedCourses.findIndex(c => c.id === formData.id);
             if (existingIdx >= 0) { updatedCourses[existingIdx] = formData; } else { updatedCourses.push(formData); }
             await setDoc(doc(db, "rba_lms", "main_db"), { courses: updatedCourses }, { merge: true });
             setView('list');
         } catch(error) {}
         setIsSubmitting(false);
      };

      const handleSaveModul = async (e) => {
         e.preventDefault(); setIsSubmitting(true);
         try {
             let updatedCourses = [...courses];
             const courseIdx = updatedCourses.findIndex(c => c.id === activeCourse.id);
             if (courseIdx >= 0) {
                 const newModul = { ...modulForm, id: modulForm.id || 'mdl_' + Date.now().toString(36) };
                 const existingModules = updatedCourses[courseIdx].modules || [];
                 if (modulForm.id) { const mIdx = existingModules.findIndex(m => m.id === modulForm.id); if (mIdx >= 0) existingModules[mIdx] = newModul; } else { existingModules.push(newModul); }
                 updatedCourses[courseIdx].modules = existingModules;
                 await setDoc(doc(db, "rba_lms", "main_db"), { courses: updatedCourses }, { merge: true });
                 setActiveCourse(updatedCourses[courseIdx]);
                 setIsModulFormOpen(false); setModulForm({ id: '', title: '', desc: '', type: 'youtube', url: '', questions: [] }); setUploadMsg('');
             }
         } catch(error) {}
         setIsSubmitting(false);
      };

      const handleDeleteModul = async () => {
         if (!modulToDelete) return;
         setIsSubmitting(true);
         try {
             let updatedCourses = [...courses];
             const courseIdx = updatedCourses.findIndex(c => c.id === activeCourse.id);
             if (courseIdx >= 0) {
                 updatedCourses[courseIdx].modules = (updatedCourses[courseIdx].modules || []).filter(m => m.id !== modulToDelete);
                 await setDoc(doc(db, "rba_lms", "main_db"), { courses: updatedCourses }, { merge: true });
                 setActiveCourse(updatedCourses[courseIdx]);
                 setModulToDelete(null);
             }
         } catch(error) {}
         setIsSubmitting(false);
      };

      if (view === 'form') {
         return (
            <div className="p-4 md:p-6 w-full max-w-3xl mx-auto space-y-6 animate-slide-up pb-24">
               <div className="flex items-center gap-4 mb-6">
                  <button onClick={() => setView('list')} className="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 rounded-full"><ArrowLeft size={20} /></button>
