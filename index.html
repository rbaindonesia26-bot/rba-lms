                  <h1 className="text-2xl font-black text-slate-900 dark:text-white">{formData.id && String(formData.id).startsWith('crs_') ? 'Buat Program Baru' : 'Edit Program'}</h1>
               </div>
               <form onSubmit={handleSave} className="space-y-5 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                  <div><label className="block text-sm font-bold mb-2">Judul Program</label><input type="text" required value={formData.title || ''} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm" /></div>
                  <div><label className="block text-sm font-bold mb-2">Deskripsi Lengkap</label><textarea required rows="4" value={formData.desc || ''} onChange={e => setFormData({...formData, desc: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm resize-none"></textarea></div>
                  <div className="grid grid-cols-2 gap-4">
                     <div>
                        <label className="block text-sm font-bold mb-2">Kategori</label>
                        <select value={formData.kategori} onChange={e => setFormData({...formData, kategori: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm">
                           <option value="Bahasa Arab">Bahasa Arab</option>
                           <option value="Ulum Syar'i">Ulum Syar'i</option>
                           <option value="Program Bersanad">Program Bersanad</option>
                        </select>
                     </div>
                     <div>
                        <label className="block text-sm font-bold mb-2">Status Visibilitas</label>
                        <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm">
                           <option value="Draft">Draft (Tersembunyi)</option>
                           <option value="Aktif">Aktif (Bisa Diakses)</option>
                        </select>
                     </div>
                  </div>
                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                     <label className="block text-sm font-bold mb-2">Gambar Sampul (Opsional)</label>
                     <input type="file" accept="image/*" onChange={handleImageUpload} disabled={isUploading} className="mb-3 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-100 file:text-blue-700" />
                     {uploadMsg && <p className="text-xs font-bold text-blue-600 mb-2">{uploadMsg}</p>}
                     <input type="text" placeholder="Atau paste URL gambar di sini..." value={formData.coverUrl || ''} onChange={e => setFormData({...formData, coverUrl: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600 text-sm" />
                  </div>
                  <div className="pt-4 flex justify-end gap-3 border-t border-slate-100 dark:border-slate-800">
                     <Button type="button" variant="ghost" onClick={() => setView('list')}>Batal</Button>
                     <Button type="submit" disabled={isSubmitting || isUploading} className="gap-2 border-none"><Save size={18}/> Simpan Program</Button>
                  </div>
               </form>
            </div>
         );
      }

      if (view === 'modules') {
         const modules = activeCourse.modules || [];
         return (
            <div className="p-4 md:p-6 w-full max-w-5xl mx-auto space-y-6 pb-24">
               <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 border-b border-slate-200 dark:border-slate-800 pb-4">
                  <div className="flex items-center gap-4">
                     <button onClick={() => setView('list')} className="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-full transition-colors"><ArrowLeft size={20} className="text-slate-600 dark:text-slate-300" /></button>
                     <div><h1 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">Materi: {activeCourse.title}</h1></div>
                  </div>
                  <Button onClick={() => { setModulForm({ id: '', title: '', desc: '', type: 'youtube', url: '', questions: [] }); setIsModulFormOpen(true); }} className="w-full sm:w-auto gap-2 text-sm border-none"><PlusCircle size={18}/> Tambah Tahapan</Button>
               </div>

               <div className="space-y-3">
                  {modules.map((m, i) => {
                      const Meta = getModulMeta(m.type); const Icon = Meta.icon;
                      return (
                      <Card key={m.id} className="p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4 hover:shadow-md">
                          <div className="flex items-center gap-4">
                             <div className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-500 shrink-0">{i + 1}</div>
                             <div>
                                 <h3 className="font-bold text-slate-900 dark:text-white text-base sm:text-lg">{m.title}</h3>
                                 <Badge variant="slate" className="!text-[9px] sm:!text-[10px] mt-1"><Icon size={12} className={`mr-1 ${Meta.color}`}/> {Meta.label}</Badge>
                             </div>
                          </div>
                          <div className="flex gap-2">
                              <button onClick={() => { setModulForm(m); setIsModulFormOpen(true); }} className="p-2 text-blue-500 bg-blue-50 hover:bg-blue-100 rounded-lg"><PenTool size={16}/></button>
                              <button onClick={() => setModulToDelete(m.id)} className="p-2 text-rose-500 bg-rose-50 hover:bg-rose-100 rounded-lg"><Trash2 size={16}/></button>
                          </div>
                      </Card>
                  )})}
               </div>

               {isModulFormOpen && (
                   <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] overflow-y-auto p-4 sm:p-6 lg:p-8 custom-scrollbar">
                      <div className="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl shadow-2xl w-full max-w-5xl mx-auto relative border border-slate-200 dark:border-slate-700 p-6 sm:p-10 mt-8 mb-20">
                          <h3 className="text-2xl sm:text-3xl font-black mb-6">{modulForm.id ? 'Edit Tahapan' : 'Tambah Tahapan Baru'}</h3>
                          <form onSubmit={handleSaveModul} className="space-y-6">
                              <div><label className="block text-sm sm:text-base font-bold mb-2">Judul</label><input type="text" required value={modulForm.title || ''} onChange={e => setModulForm({...modulForm, title: e.target.value})} className="w-full px-4 py-3 sm:py-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm sm:text-base" /></div>
                              <div><label className="block text-sm sm:text-base font-bold mb-2">Deskripsi</label><textarea required rows="3" value={modulForm.desc || ''} onChange={e => setModulForm({...modulForm, desc: e.target.value})} className="w-full px-4 py-3 sm:py-4 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm sm:text-base resize-none"></textarea></div>
                              <div>
                                  <label className="block text-sm sm:text-base font-bold mb-2">Jenis Materi</label>
                                  <select value={modulForm.type} onChange={e => setModulForm({...modulForm, type: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm">
                                      <option value="youtube">Video YouTube</option>
                                      <option value="pemisah">📁 Pemisah Bab / Folder</option>
                                      <option value="video_upload">Video Internal</option>
                                      <option value="zoom">Zoom/Meet</option>
                                      <option value="pdf">Modul PDF / MPI</option>
                                      <option value="kuis">Ujian Kuis / Evaluasi</option>
                                      <option value="tugas">Tugas Praktik (Upload)</option>
                                  </select>
                              </div>
                              
                              {(modulForm.type !== 'kuis' && modulForm.type !== 'tugas' && modulForm.type !== 'pemisah') && (
                                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                                      <label className="block text-sm font-bold mb-2">Sumber (URL / Berkas)</label>
                                      {(modulForm.type === 'video_upload' || modulForm.type === 'pdf') && (
                                          <input type="file" onChange={handleMaterialUpload} disabled={isUploading} className="mb-3 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-100 file:text-blue-700" />
                                      )}
                                      <input type="text" required value={modulForm.url || ''} onChange={e => setModulForm({...modulForm, url: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-600 text-sm" />
                                  </div>
                              )}
                              
                              {modulForm.type === 'kuis' && (
                                  <div className="bg-orange-50 dark:bg-orange-900/20 p-5 sm:p-6 rounded-xl border border-orange-200 dark:border-orange-800 space-y-4">
                                      <div className="flex justify-between items-center flex-wrap gap-3">
                                         <label className="block text-sm font-bold text-orange-800 dark:text-orange-300">Daftar Pertanyaan</label>
                                         <div className="flex gap-2">
                                            <Button type="button" size="sm" onClick={handleAIGenerate} disabled={isGeneratingAI} className="gap-2 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white border-none shadow-md shadow-violet-500/30 text-xs py-1 px-3 h-auto transition-transform hover:-translate-y-0.5">
                                                {isGeneratingAI ? <Loader2 size={14} className="animate-spin"/> : <Sparkles size={14}/>} 
                                                {isGeneratingAI ? 'AI Sedang Meracik...' : '✨ Buat Soal via AI'}
                                            </Button>
                                            <Button type="button" size="sm" variant="white" onClick={() => {
                                                const newQ = { q: '', options: ['', '', '', ''], ans: 0 };
                                                setModulForm({...modulForm, questions: [...(modulForm.questions || []), newQ]});
                                            }} className="text-orange-600 border-orange-200 text-xs py-1 px-2 h-auto shadow-sm">+ Manual</Button>
                                         </div>
                                      </div>
                                      
                                      {uploadMsg && <div className={`p-3 text-xs font-bold rounded-xl border shadow-sm ${uploadMsg.startsWith('Error') || uploadMsg.startsWith('Peringatan') ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}>{uploadMsg}</div>}

                                      {(modulForm.questions || []).map((q, qIdx) => (
                                          <div key={qIdx} className="bg-white dark:bg-slate-900 p-3 rounded-lg border border-orange-100 dark:border-orange-700 relative shadow-sm">
                                              <button type="button" onClick={() => {
                                                  const newQs = [...modulForm.questions]; newQs.splice(qIdx, 1); setModulForm({...modulForm, questions: newQs});
                                              }} className="absolute top-2 right-2 p-1.5 bg-rose-50 text-rose-500 rounded-md hover:bg-rose-100 transition-colors"><Trash2 size={14}/></button>
                                              
                                              <input type="text" placeholder={`Pertanyaan ${qIdx + 1}`} required value={q.q} onChange={e => {
                                                  const newQs = [...modulForm.questions]; newQs[qIdx].q = e.target.value; setModulForm({...modulForm, questions: newQs});
                                              }} className="w-full pr-8 pl-3 py-2 text-sm rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 mb-3 focus:ring-1 focus:ring-orange-500 font-medium" />
                                              
                                              <div className="space-y-2">
                                                 {q.options.map((opt, oIdx) => (
                                                     <div key={oIdx} className="flex items-center gap-2">
                                                         <input type="radio" name={`ans_${qIdx}`} required checked={q.ans === oIdx} onChange={() => {
                                                             const newQs = [...modulForm.questions]; newQs[qIdx].ans = oIdx; setModulForm({...modulForm, questions: newQs});
                                                         }} className="w-4 h-4 text-orange-600 focus:ring-orange-500 border-slate-300"/>
                                                         <input type="text" placeholder={`Pilihan ${['A','B','C','D'][oIdx]}`} required value={opt} onChange={e => {
                                                             const newQs = [...modulForm.questions]; newQs[qIdx].options[oIdx] = e.target.value; setModulForm({...modulForm, questions: newQs});
                                                         }} className="flex-1 px-3 py-1.5 text-xs rounded-md border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-1 focus:ring-orange-500" />
                                                     </div>
                                                 ))}
                                              </div>
                                          </div>
                                      ))}
                                      {(!modulForm.questions || modulForm.questions.length === 0) && <p className="text-xs text-orange-600/70 text-center font-medium py-3 border-2 border-dashed border-orange-200 rounded-lg bg-white">Belum ada soal. Klik "+ Manual" atau "✨ Buat Soal via AI".</p>}
                                  </div>
                              )}
                              
                              {modulForm.type === 'tugas' && (
                                  <div className="bg-purple-50 dark:bg-purple-900/20 p-4 rounded-xl border border-purple-200 dark:border-purple-800">
                                      <p className="text-sm font-bold text-purple-800 dark:text-purple-300 mb-2">Pengaturan Tugas Upload</p>
                                      <p className="text-xs text-purple-600 dark:text-purple-400">Siswa akan diminta mengunggah file Audio atau Gambar pada materi ini. Tidak perlu menyematkan URL untuk jenis ini.</p>
                                  </div>
                              )}
                              
                              {modulForm.type === 'pemisah' && (
                                  <div className="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl border border-slate-300 dark:border-slate-700 text-center">
                                      <FolderOpen size={32} className="mx-auto text-slate-500 mb-2" />
                                      <p className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-1">Banner Pembatas Bab</p>
                                      <p className="text-xs text-slate-600 dark:text-slate-400">Tahapan ini berfungsi sebagai judul besar untuk mengelompokkan materi. Tidak membutuhkan tautan/link.</p>
                                  </div>
                              )}

                              <div className="flex justify-end gap-3 pt-3">
                                  <Button type="button" variant="ghost" onClick={() => setIsModulFormOpen(false)}>Batal</Button>
                                  <Button type="submit" disabled={isSubmitting || isUploading} className="border-none">Simpan</Button>
                              </div>
                          </form>
                      </div>
                   </div>
               )}

               {showApiModal && (
                  <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
                     <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-md p-6 border border-slate-200 dark:border-slate-700 animate-slide-up text-center">
                        <div className="w-16 h-16 bg-violet-100 dark:bg-violet-900/30 text-violet-500 rounded-full flex items-center justify-center mx-auto mb-4">
                           <Sparkles size={32} />
                        </div>
                        <h2 className="text-xl font-bold mb-2 text-slate-900 dark:text-white">Kunci Rahasia AI</h2>
                        <p className="text-sm text-slate-500 mb-6">Masukkan API Key Google Gemini Anda untuk mengaktifkan fitur pembuatan soal presisi.</p>
                        <input type="password" value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} placeholder="Contoh: AIzaSyB0T3gu..." className="w-full px-4 py-3 mb-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-violet-600 text-sm font-mono text-center" />
                        <div className="flex gap-3">
                           <Button type="button" variant="ghost" onClick={() => setShowApiModal(false)} className="flex-1">Batal</Button>
                           <Button type="button" onClick={() => {
                               if(apiKeyInput.trim()){
                                   localStorage.setItem('rba_ai_key', apiKeyInput.trim());
                                   setShowApiModal(false);
                                   executeAI(apiKeyInput.trim());
                               }
                           }} className="flex-1 bg-violet-600 hover:bg-violet-700 text-white shadow-violet-500/30 border-none">Simpan & Mulai</Button>
                        </div>
                     </div>
                  </div>
               )}

               {modulToDelete && (
                  <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                     <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-slate-200 dark:border-slate-700 animate-slide-up text-center">
                        <div className="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                           <Trash2 size={32} />
                        </div>
                        <h2 className="text-xl font-bold mb-2 text-slate-900 dark:text-white">Hapus Tahapan?</h2>
                        <p className="text-sm text-slate-500 mb-6 leading-relaxed">Materi yang dihapus tidak dapat dikembalikan. Lanjutkan?</p>
                        <div className="flex gap-3">
                           <Button type="button" variant="ghost" onClick={() => setModulToDelete(null)} className="flex-1">Batal</Button>
                           <Button type="button" onClick={handleDeleteModul} disabled={isSubmitting} className="flex-1 bg-rose-600 hover:bg-rose-700 shadow-rose-500/30 border-none text-white">Ya, Hapus</Button>
                        </div>
                     </div>
                  </div>
               )}

            </div>
         );
      }

      const displayedCourses = courses.filter(c => kategoriFilter === 'Semua' ? true : c.kategori === kategoriFilter);

      return (
         <div className="p-4 md:p-6 w-full max-w-7xl mx-auto space-y-6 animate-slide-up pb-24">
            <div className="flex flex-col sm:flex-row justify-between sm:items-end mb-6 gap-4">
               <div><h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">Manajemen Program</h1></div>
               <div className="flex gap-3 w-full sm:w-auto">
                  <div className="relative flex-1 sm:w-48">
                      <Filter className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={16} />
                      <select value={kategoriFilter} onChange={e=>setKategoriFilter(e.target.value)} className="w-full pl-9 pr-8 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-blue-600 text-sm font-bold text-slate-700 dark:text-slate-300 appearance-none">
                          <option value="Semua">Semua Kategori</option>
                          <option value="Bahasa Arab">Bahasa Arab</option>
                          <option value="Ulum Syar'i">Ulum Syar'i</option>
                          <option value="Program Bersanad">Program Bersanad</option>
                      </select>
                      <ChevronDown size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"/>
                  </div>
                  <Button onClick={handleAdd} className="gap-2 border-none shrink-0"><PlusCircle size={18}/> Tambah</Button>
               </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
               {displayedCourses.length === 0 ? (
                   <div className="col-span-full py-12 text-center text-slate-500 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">Tidak ada program di kategori ini.</div>
               ) : displayedCourses.map((prog, i) => (
                  <Card key={i} 
                     draggable 
                     onDragStart={() => setDraggedItemIdx(i)} 
                     onDragOver={(e) => e.preventDefault()} 
                     onDrop={() => handleDropCourse(i)}
                     className={`p-0 flex flex-col justify-between overflow-hidden border-2 transition-all cursor-grab active:cursor-grabbing hover:shadow-lg ${draggedItemIdx === i ? 'opacity-50 border-blue-500 border-dashed scale-95' : 'border-slate-200 dark:border-slate-800'}`}>
                     {prog.coverUrl ? <div className="h-32 relative pointer-events-none"><img src={prog.coverUrl} className="absolute inset-0 w-full h-full object-cover" /></div> : <div className="h-32 bg-slate-100 dark:bg-slate-800 flex items-center justify-center pointer-events-none"><BookOpen size={28} className="text-slate-300"/></div>}
                     <div className="p-4 flex-1 flex flex-col pointer-events-none">
                        <div className="flex justify-between items-start mb-2"><Badge variant="emerald" className="!text-[10px] uppercase">{prog.status}</Badge><GripVertical size={16} className="text-slate-400"/></div>
                        <h3 className="font-bold text-base mb-2 line-clamp-2 text-slate-900 dark:text-white">{prog.title}</h3>
                        <div className="flex justify-between items-center mt-auto pt-4 border-t border-slate-100 dark:border-slate-800 pointer-events-auto">
                           <span className="text-xs font-bold text-slate-500">{(prog.modules || []).length} Materi</span>
                           <div className="flex gap-1">
                              <button onClick={() => openModules(prog)} className="p-2 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-lg" title="Kelola Materi"><Layers size={16}/></button>
                              <button onClick={() => handleEdit(prog)} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg" title="Edit Program"><PenTool size={16}/></button>
                              <button onClick={() => setCourseToDelete(prog.id)} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-lg" title="Hapus Program"><Trash2 size={16}/></button>
                           </div>
                        </div>
                     </div>
                  </Card>
               ))}
            </div>
            
            {courseToDelete && (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-slate-200 dark:border-slate-700 animate-slide-up text-center">
                        <div className="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Trash2 size={32} />
                        </div>
                        <h2 className="text-xl font-bold mb-2 text-slate-900 dark:text-white">Hapus Program Ini?</h2>
                        <p className="text-sm text-slate-500 mb-6 leading-relaxed">Seluruh tahapan materi, kuis, tugas, dan data progres santri di dalam program ini akan ikut terhapus secara permanen. Lanjutkan?</p>
                        <div className="flex gap-3">
                            <Button type="button" variant="ghost" onClick={() => setCourseToDelete(null)} className="flex-1">Batal</Button>
                            <Button type="button" onClick={handleDeleteCourse} disabled={isSubmitting} className="flex-1 bg-rose-600 hover:bg-rose-700 shadow-rose-500/30 border-none text-white">Ya, Hapus</Button>
                        </div>
                    </div>
                </div>
            )}
         </div>
      );
    };

    const PersetujuanAdmin = ({ enrollments, courses, usersData, db }) => {
      let pendingList = [];
      Object.entries(enrollments).forEach(([uid, userData]) => {
         if (userData && userData.classes) {
            Object.entries(userData.classes).forEach(([courseId, status]) => {
               if (status === 'pending') {
                  const userEntry = Object.entries(usersData).find(([token, u]) => u.uid === uid);
                  const courseObj = courses.find(c => c.id === courseId);
                  
                  const userName = userEntry ? (userEntry[1].name || userEntry[0]) : 'Santri Baru (Proses Data)';
                  const userToken = userEntry ? userEntry[0] : uid.substring(0,8).toUpperCase();
                  const courseTitle = courseObj ? courseObj.title : 'Kelas Terhapus / Proses';
                  
                  pendingList.push({ uid, courseId, userName, userToken, courseTitle });
               }
            });
         }
      });

      const handleAction = async (uid, courseId, newStatus) => {
         try { 
             const courseObj = courses.find(c => c.id === courseId);
             const courseTitle = courseObj ? courseObj.title : 'Kelas';
             const notifMsg = `Pengajuan kelas "${courseTitle}" Anda telah ${newStatus === 'approved' ? 'Disetujui ✅' : 'Ditolak ❌'}.`;
             
             const currentNotifs = enrollments[uid]?.notifications || [];
             const newNotifs = [{ id: Date.now(), text: notifMsg, read: false, time: Date.now() }, ...currentNotifs].slice(0, 10);

             await updateDoc(doc(db, "rba_lms", "main_db"), {
                 [`enrollments.${uid}.classes.${courseId}`]: newStatus,
                 [`enrollments.${uid}.notifications`]: newNotifs
             });
         } 
         catch (e) { 
             console.error("Update status error:", e); 
             try { 
                 await setDoc(doc(db, "rba_lms", "main_db"), {
                     enrollments: { [uid]: { classes: { [courseId]: newStatus }, notifications: newNotifs } }
                 }, { merge: true });
             } catch(err) {}
         }
      };

      const handleSendWaPersetujuan = (req) => {
          const text = `Assalamu'alaikum ${req.userName},\n\nAlhamdulillah, permintaan akses Anda untuk kelas *${req.courseTitle}* telah kami *SETUJUI* ✅.\n\nSilakan login ke portal Rumah Bahasa Arab menggunakan Token Anda (${req.userToken}) untuk mulai belajar.\n\nSelamat belajar!`;
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      return (
         <div className="p-4 md:p-6 w-full max-w-7xl mx-auto space-y-6 pb-24">
            <h1 className="text-3xl font-black mb-6">Persetujuan Kelas</h1>
            <div className="space-y-4">
               {pendingList.length === 0 ? (
                  <div className="text-center py-12 text-slate-500 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300">
                     <CheckCircle size={48} className="mx-auto mb-4 opacity-20" />
                     <p>Tidak ada permintaan yang menunggu persetujuan.</p>
                  </div>
               ) : (
                  pendingList.map((req, i) => (
                     <Card key={i} className="p-5 flex flex-col md:flex-row justify-between md:items-center border-l-4 border-l-amber-500">
                        <div className="flex-1">
                           <Badge variant="gold" className="!text-[10px] mb-1">MENUNGGU</Badge>
                           <h3 className="font-bold text-lg">{req.userName} <span className="text-sm font-mono text-slate-500 ml-1">({req.userToken})</span></h3>
                           <p className="text-sm text-slate-500">Minta akses: <strong>{req.courseTitle}</strong></p>
                        </div>
                        <div className="flex gap-2 mt-4 md:mt-0">
                           <button onClick={() => handleSendWaPersetujuan(req)} className="p-2 text-emerald-500 hover:bg-emerald-50 rounded-lg transition-colors" title="Kabari via WA"><MessageCircle size={18}/></button>
                           <Button size="sm" variant="outline" onClick={() => handleAction(req.uid, req.courseId, 'rejected')}>Tolak</Button>
                           <Button size="sm" onClick={() => handleAction(req.uid, req.courseId, 'approved')} className="border-none">Setujui</Button>
                        </div>
                     </Card>
                  ))
               )}
            </div>
         </div>
      );
    };

    const DetailProgram = ({ program, onBack, onEnroll, enrollmentStatus, role, onGoToClass, onManage }) => {
      if (!program) return null;
      return (
         <div className="p-4 md:p-6 lg:p-8 w-full max-w-5xl mx-auto space-y-6 pb-24">
            <button onClick={onBack} className="flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-blue-600 mb-2"><ArrowLeft size={16}/> Kembali</button>
            <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 overflow-hidden flex flex-col md:flex-row shadow-sm">
               <div className="w-full md:w-2/5 h-48 md:h-auto bg-slate-100 relative shrink-0">
                  {program.coverUrl ? <img src={program.coverUrl} className="absolute inset-0 w-full h-full object-cover" /> : <div className="absolute inset-0 flex items-center justify-center"><ImageIcon size={48} className="text-slate-300"/></div>}
               </div>
               <div className="p-6 md:p-8 flex-1 flex flex-col justify-center">
                  <Badge variant="blue" className="!text-[10px] uppercase mb-3">{program.kategori}</Badge>
                  <h1 className="text-2xl md:text-3xl font-black mb-4">{program.title}</h1>
                  <p className="text-slate-600 text-sm md:text-base leading-relaxed mb-8">{program.desc}</p>
                  
                  <div className="mt-auto pt-6 border-t border-slate-100 w-full">
                     {(role === 'admin' || role === 'guru') ? (
                        <div className="flex flex-col sm:flex-row gap-3 w-full">
                           <Button className="bg-blue-600 hover:bg-blue-700 text-white border-none flex-1" onClick={onGoToClass}>
                              <MessageCircle size={18} className="mr-2"/> Masuk Kelas & Balas Diskusi
                           </Button>
                           <Button variant="outline" onClick={onManage} className="flex-1">
                              <FolderOpen size={18} className="mr-2"/> {role === 'admin' ? 'Manajemen Program' : 'Kelola Materi'}
                           </Button>
                        </div>
                     ) : (
                        <div className="flex gap-3">
                           {enrollmentStatus === 'approved' && <Button className="bg-emerald-600 hover:bg-emerald-700 text-white border-none" onClick={onGoToClass}><MonitorPlay size={18} className="mr-2"/> Lanjut Belajar</Button>}
                           {enrollmentStatus === 'pending' && <Button className="bg-amber-500 text-white border-none opacity-80 cursor-not-allowed"><Clock size={18} className="mr-2"/> Menunggu Konfirmasi</Button>}
                           {!enrollmentStatus && <Button className="bg-blue-600 hover:bg-blue-700 text-white border-none" onClick={() => onEnroll(program.id)}><PlusCircle size={18} className="mr-2"/> Minta Akses Kelas</Button>}
                        </div>
                     )}
                  </div>
               </div>
            </div>
         </div>
      );
    };

    const RuangKelas = ({ program, onBack, userProgress = [], onMarkComplete, role, userName, db, uid, storage, enrollments }) => {
      const modules = program?.modules || [];
      const [activeModul, setActiveModul] = useState(null);
      
      const [comment, setComment] = useState('');
      const [discussions, setDiscussions] = useState([]);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizScore, setQuizScore] = useState(null);
      
      const [taskSubmissions, setTaskSubmissions] = useState({});
      const [taskUrlInput, setTaskUrlInput] = useState('');
      const [isUploadingTask, setIsUploadingTask] = useState(false);
      const [uploadTaskMsg, setUploadTaskMsg] = useState('');
      const [gradeInputs, setGradeInputs] = useState({});

      useEffect(() => {
          if (modules.length > 0 && !activeModul) { setActiveModul(modules[0]); } 
          else if (modules.length > 0 && activeModul) { const u = modules.find(m => m.id === activeModul.id); if (u) setActiveModul(u); }
      }, [program]);

      useEffect(() => {
          setQuizAnswers({}); setQuizScore(null); setTaskSubmissions({}); setGradeInputs({}); setUploadTaskMsg('');
          if (!activeModul || !db) return;
          
          const unsubDisc = onSnapshot(doc(db, "rba_lms", `diskusi_${program.id}_${activeModul.id}`), (docSnap) => {
              if(docSnap.exists()) { setDiscussions(docSnap.data().comments || []); } else { setDiscussions([]); }
          });
          
          let unsubTask = () => {};
          if (activeModul.type === 'tugas') {
             unsubTask = onSnapshot(doc(db, "rba_lms", `tugas_${program.id}_${activeModul.id}`), (docSnap) => {
                 if(docSnap.exists()) { setTaskSubmissions(docSnap.data().submissions || {}); } else { setTaskSubmissions({}); }
             });
          }
          return () => { unsubDisc(); unsubTask(); };
      }, [activeModul, program, db]);

      const handleSendComment = async (e) => {
          e.preventDefault();
          if(!comment.trim() || !db) return;
          try {
              const newComment = { id: Date.now().toString(), text: comment, sender: userName, role: role, timestamp: Date.now() };
              const docRef = doc(db, "rba_lms", `diskusi_${program.id}_${activeModul.id}`);
              await setDoc(docRef, { comments: [...discussions, newComment] }, { merge: true });
              setComment(''); 
          } catch(error) {}
      };

      const handleQuizSubmit = () => {
          const questions = activeModul.questions || []; let correct = 0;
          questions.forEach((q, idx) => { if (quizAnswers[idx] === q.ans) correct++; });
          const score = questions.length > 0 ? Math.round((correct / questions.length) * 100) : 100;
          setQuizScore(score);
      };

      const handleUploadTask = async (e) => {
          e.preventDefault();
          if(!taskUrlInput.trim() || !db) return;
          setIsUploadingTask(true);
          setUploadTaskMsg('');
          try {
              const newSubmission = { studentName: userName, url: taskUrlInput, type: 'link', timestamp: Date.now(), score: null };
              
              // PERBAIKAN: Struktur map objek agar terbaca oleh Dasbor Guru
              await setDoc(doc(db, "rba_lms", `tugas_${program.id}_${activeModul.id}`), { 
                  submissions: {
                      [uid]: newSubmission
                  } 
              }, { merge: true });
              
              setUploadTaskMsg('✅ Tugas berhasil dikirim!');
              setTaskUrlInput('');
          } catch (error) {
              console.error("Gagal mengirim:", error);
              setUploadTaskMsg('❌ Gagal mengirim tugas. Pastikan koneksi internet Anda stabil.');
          }
          setIsUploadingTask(false);
      };

      const handleGradeTask = async (studentUid) => {
          let score = gradeInputs[studentUid];
          if (score === undefined || score === '') return;
          score = parseInt(score); if (isNaN(score)) return;
          score = Math.max(0, Math.min(100, score));

          try {
              await setDoc(doc(db, "rba_lms", `tugas_${program.id}_${activeModul.id}`), {
                  submissions: { [studentUid]: { score: score } }
              }, { merge: true });
              
              if (enrollments) {
                 const notifMsg = `Tugas "${activeModul.title}" Anda telah dinilai oleh Ustadz (Nilai: ${score}). ✅`;
                 const currentNotifs = enrollments[studentUid]?.notifications || [];
                 const newNotifs = [{ id: Date.now(), text: notifMsg, read: false, time: Date.now() }, ...currentNotifs].slice(0, 10);
                 
                 await setDoc(doc(db, "rba_lms", "main_db"), {
                     enrollments: {
                         [studentUid]: {
                             notifications: newNotifs
                         }
                     }
                 }, { merge: true });
              }
          } catch(error) { console.error("Gagal simpan nilai:", error); }
      };

      const getModulMeta = (type) => {
         switch(type) {
             case 'youtube': return { icon: Youtube, color: 'text-rose-600', label: 'YouTube' };
             case 'video_upload': return { icon: PlayCircle, color: 'text-blue-500', label: 'Video Internal' };
             case 'zoom': return { icon: VideoIcon, color: 'text-indigo-500', label: 'Live Session' };
             case 'pdf': return { icon: FileText, color: 'text-rose-500', label: 'Modul PDF / MPI' };
             case 'kuis': return { icon: FileQuestion, color: 'text-orange-500', label: 'Ujian Kuis / Evaluasi' };
             case 'tugas': return { icon: UploadCloud, color: 'text-purple-500', label: 'Tugas Praktik (Upload)' };
             case 'pemisah': return { icon: FolderOpen, color: 'text-slate-700 dark:text-slate-300', label: 'Pembatas Bab' };
             default: return { icon: Link2, color: 'text-purple-500', label: 'Eksternal' };
         }
      };

      if (!program) return null;

      const renderMainViewer = () => {
         if (modules.length === 0) return <div className="w-full aspect-video bg-slate-50 rounded-2xl flex items-center justify-center border-2 border-dashed">Materi Belum Tersedia</div>;
         if (!activeModul) return null;
         
         const isCompleted = activeModul && (userProgress || []).includes(activeModul.id);

         switch (activeModul.type) {
             case 'youtube': 
                 let ytUrl = activeModul.url || '';
                 if (ytUrl.includes('watch?v=')) ytUrl = ytUrl.replace('watch?v=', 'embed/').split('&')[0];
                 else if (ytUrl.includes('youtu.be/')) ytUrl = ytUrl.replace('youtu.be/', 'youtube.com/embed/').split('?')[0];
                 return <div className="w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-lg"><iframe className="w-full h-full" src={ytUrl} frameBorder="0" allowFullScreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>;
             case 'video_upload': return <div className="w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-lg"><video className="w-full h-full object-contain bg-black" controls controlsList="nodownload"><source src={activeModul.url} type="video/mp4" /></video></div>;
             case 'zoom': return <div className="w-full aspect-video bg-indigo-50 border-2 border-indigo-100 rounded-2xl flex flex-col items-center justify-center p-6 text-center shadow-inner"><VideoIcon size={64} className="text-indigo-500 mb-4"/><h3 className="text-2xl font-black mb-2 text-indigo-900">Live Session (Zoom/Meet)</h3><p className="text-sm text-indigo-600/80 mb-6 max-w-sm">Siapkan catatan Anda dan bergabunglah ke ruang kelas virtual pada waktu yang telah ditentukan.</p><Button size="lg" className="bg-indigo-600 hover:bg-indigo-700 shadow-indigo-500/30 border-none" onClick={() => window.open(activeModul.url, '_blank')}><VideoIcon size={20} className="mr-2"/> Masuk ke Ruang Virtual</Button></div>;
             case 'pdf': return <div className="w-full aspect-video bg-rose-50 border-2 border-rose-100 rounded-2xl flex flex-col items-center justify-center p-6 text-center shadow-inner"><FileText size={64} className="text-rose-500 mb-4"/><h3 className="text-2xl font-black mb-2 text-rose-900">Modul Pembelajaran / MPI</h3><p className="text-sm text-rose-600/80 mb-6 max-w-sm">Baca dan pelajari materi berikut dengan saksama untuk menambah pemahaman Anda.</p><Button size="lg" className="bg-rose-500 hover:bg-rose-600 shadow-rose-500/30 border-none" onClick={() => window.open(activeModul.url, '_blank')}><FileText size={20} className="mr-2"/> Buka Modul / MPI</Button></div>;
             
             case 'kuis':
                 const questions = activeModul.questions || [];
                 const isPengajar = role === 'admin' || role === 'guru';

                 if (questions.length === 0) return <div className="w-full aspect-video bg-orange-50 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-orange-200"><FileQuestion size={64} className="text-orange-300 mb-4"/><h3 className="text-2xl font-black mb-2 text-slate-700">Kuis Belum Siap</h3><p className="text-slate-500">Guru belum memasukkan soal ke dalam kuis ini.</p></div>;
                 
                 return (
                     <div className="w-full bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-5 sm:p-8">
                         <div className="flex items-center gap-4 mb-6 border-b border-slate-100 dark:border-slate-800 pb-6">
                             <div className="p-3 bg-orange-100 dark:bg-orange-900/30 text-orange-500 rounded-xl"><FileQuestion size={32}/></div>
                             <div>
                                 <h3 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mb-1">Evaluasi Pemahaman</h3>
                                 <p className="text-sm text-slate-500">
                                     {isPengajar ? 'Mode Pratinjau: Kunci jawaban ditampilkan otomatis.' : 'Kirim jawaban dengan tepat. Nilai minimal kelulusan: '}
                                     {!isPengajar && <span className="font-bold text-orange-500">70</span>}
                                 </p>
                             </div>
                         </div>

                         {!isPengajar && isCompleted && (
                             <div className="p-6 rounded-xl mb-6 text-center bg-emerald-50 border border-emerald-200 text-emerald-700">
                                 <CheckCircle size={48} className="mx-auto mb-2 text-emerald-500"/>
                                 <h4 className="font-black text-xl mb-1">Anda Telah Lulus Ujian Ini</h4>
                                 <p className="text-sm">Nilai Anda sudah tersimpan. Silakan lanjut ke materi berikutnya.</p>
                             </div>
                         )}

                         {!isPengajar && !isCompleted && quizScore !== null && (
                             <div className={`p-5 rounded-xl mb-6 text-center border shadow-sm ${quizScore >= 70 ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                                 <h4 className="font-black text-xl mb-1">{quizScore >= 70 ? '🎉 Alhamdulillah, Anda Lulus!' : '⚠️ Ujian Belum Lulus'}</h4>
                                 <p className="text-sm">Nilai akhir Anda adalah <span className="font-black text-2xl ml-1">{quizScore}</span></p>
                             </div>
                         )}

                         <div className="space-y-6">
                             {questions.map((q, qIdx) => (
                                 <div key={qIdx} className="bg-slate-50 dark:bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-200 dark:border-slate-800">
                                     <p className="font-bold text-slate-900 dark:text-white mb-4 leading-relaxed"><span className="text-orange-500 mr-2">{qIdx + 1}.</span> {q.q}</p>
                                     <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                         {q.options.map((opt, oIdx) => {
                                             const isCorrectAnswer = q.ans === oIdx;
                                             const isSelected = quizAnswers[qIdx] === oIdx;
                                             let optionClass = isSelected ? 'bg-orange-50 border-orange-500 shadow-sm' : 'bg-white border-slate-200 hover:border-orange-300';
                                             if (isPengajar && isCorrectAnswer) optionClass = 'bg-emerald-50 border-emerald-500 shadow-sm ring-1 ring-emerald-500';

                                             return (
                                             <label key={oIdx} className={`flex items-start gap-3 p-3 rounded-xl border-2 cursor-pointer transition-all ${optionClass}`}>
                                                 <input type="radio" name={`q_${qIdx}`} className="mt-1 shrink-0 w-4 h-4 text-orange-600 focus:ring-orange-500" checked={isPengajar ? isCorrectAnswer : isSelected} onChange={() => setQuizAnswers({...quizAnswers, [qIdx]: oIdx})} disabled={isCompleted || quizScore >= 70 || isPengajar} />
                                                 <span className={`text-sm font-medium leading-snug ${isPengajar && isCorrectAnswer ? 'text-emerald-800 font-bold' : (isSelected ? 'text-orange-900' : 'text-slate-700')}`}>{opt} {isPengajar && isCorrectAnswer && ' (Kunci Jawaban)'}</span>
                                             </label>
                                         )})}
                                     </div>
                                 </div>
                             ))}
                         </div>

                         {!isPengajar && !isCompleted && (!quizScore || quizScore < 70) && (
                             <div className="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                                 <Button size="lg" onClick={handleQuizSubmit} disabled={Object.keys(quizAnswers).length < questions.length} className="w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-white border-none">
                                     {quizScore === null ? 'Kirim Jawaban & Lihat Nilai' : 'Ulangi Ujian'}
                                 </Button>
                             </div>
                         )}
                         
                         {isPengajar && (
                             <div className="mt-8 pt-4 border-t border-slate-100 text-center text-sm font-bold text-slate-500">
                                 <ShieldCheck size={18} className="inline mr-1" /> Anda sedang dalam mode Pratinjau Pengajar.
                             </div>
                         )}
                     </div>
                 );
                 
             case 'tugas':
                 const isPengajarTugas = role === 'admin' || role === 'guru';
                 const mySubmission = taskSubmissions[uid];

                 return (
                     <div className="w-full bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8">
                         <div className="flex items-center gap-4 mb-6 border-b border-slate-100 pb-6">
                             <div className="p-3 bg-purple-100 text-purple-600 rounded-xl"><UploadCloud size={32}/></div>
                             <div>
                                 <h3 className="text-xl sm:text-2xl font-black text-slate-900 mb-1">Tugas Praktik</h3>
                                 <p className="text-sm text-slate-500">Unggah file {isPengajarTugas ? 'tugas santri untuk dinilai' : 'audio atau gambar untuk dinilai Ustadz'}.</p>
                             </div>
                         </div>

                         {!isPengajarTugas ? (
                             <div className="space-y-6 animate-fade-in">
                                 {mySubmission ? (
                                     <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center">
                                         <CheckCircle size={48} className="text-emerald-500 mx-auto mb-3" />
                                         <h4 className="font-bold text-lg mb-2">Tugas Berhasil Terkirim</h4>
                                         <a href={mySubmission.url} target="_blank" className="inline-flex items-center gap-2 text-blue-600 hover:underline mb-6 bg-blue-50 px-4 py-2 rounded-lg font-bold"><Link2 size={18}/> Buka Link Tugas Saya</a><br/>
                                         <div className={`inline-block px-4 py-2 rounded-xl font-bold border ${mySubmission.score !== null ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-amber-100 text-amber-700 border-amber-200'}`}>
                                             {mySubmission.score !== null ? `⭐ Nilai Anda: ${mySubmission.score}/100` : '⏳ Sedang Menunggu Penilaian Ustadz...'}
                                         </div>
                                     </div>
                                 ) : (
                                     <form onSubmit={handleUploadTask} className="bg-purple-50 border-2 border-dashed border-purple-300 rounded-2xl p-6 sm:p-8 text-center hover:bg-purple-100/50 transition-colors">
                                         <UploadCloud size={48} className="text-purple-500 mx-auto mb-4" />
                                         <h4 className="font-bold text-xl text-purple-900 mb-2">Kirim Tautan Tugas</h4>
                                         <p className="text-sm text-purple-700/80 mb-6 max-w-md mx-auto">Untuk kelancaran sistem, mohon upload file tugas Anda ke <strong>Google Drive</strong>, buka akses tautannya (Public), dan tempel tautannya di bawah.</p>
                                         <input type="url" required placeholder="Paste link Google Drive di sini..." value={taskUrlInput} onChange={e => setTaskUrlInput(e.target.value)} className="w-full max-w-lg mx-auto px-4 py-3 rounded-xl border border-purple-200 bg-white focus:ring-2 focus:ring-purple-500 text-sm mb-4 block" />
                                         <Button type="submit" disabled={isUploadingTask || !taskUrlInput.trim()} className="w-full sm:max-w-xs mx-auto bg-purple-600 hover:bg-purple-700 text-white shadow-purple-500/30 border-none">
                                            {isUploadingTask ? 'Mengirim...' : 'Kirim Tugas'}
                                         </Button>
                                         {uploadTaskMsg && <p className={`mt-4 text-sm font-bold ${uploadTaskMsg.includes('Gagal') ? 'text-rose-600' : 'text-emerald-600'}`}>{uploadTaskMsg}</p>}
                                     </form>
                                 )}
                             </div>
                         ) : (
                             <div className="space-y-4 animate-fade-in">
                                 <h4 className="font-bold text-lg mb-4 border-b border-slate-100 pb-2">Daftar Setoran Santri</h4>
                                 {Object.keys(taskSubmissions).length === 0 ? (
                                     <div className="text-center text-slate-500 py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                                         <Users size={32} className="mx-auto text-slate-300 mb-2"/> Belum ada santri yang mengumpulkan tugas.
                                     </div>
                                 ) : (
                                     Object.entries(taskSubmissions).map(([studentUid, data]) => (
                                         <div key={studentUid} className={`p-4 rounded-xl border flex flex-col lg:flex-row items-center gap-4 shadow-sm ${data.score !== null ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-200'}`}>
                                             <div className="flex-1 w-full text-center lg:text-left">
                                                 <p className="font-bold text-slate-900 mb-2 flex items-center justify-center lg:justify-start gap-2">
                                                    {data.studentName} {data.score !== null && <Badge variant="emerald" className="!text-[9px]">Selesai Dinilai</Badge>}
                                                 </p>
                                                 <a href={data.url} target="_blank" className="text-blue-600 hover:underline text-sm font-bold flex items-center justify-center lg:justify-start gap-1 bg-blue-50 px-3 py-1.5 rounded-lg w-max mx-auto lg:mx-0"><Link2 size={16}/> Buka Link Tugas</a>
                                             </div>
                                             <div className="flex items-center gap-2 mt-3 lg:mt-0 w-full lg:w-auto justify-center">
                                                 <input type="number" placeholder="0-100" min="0" max="100" value={gradeInputs[studentUid] !== undefined ? gradeInputs[studentUid] : (data.score !== null ? data.score : '')} onChange={e => setGradeInputs({...gradeInputs, [studentUid]: e.target.value})} className="w-20 px-3 py-2 rounded-lg border text-center font-bold border-slate-300 focus:ring-2 focus:ring-purple-500" />
                                                 <Button size="sm" onClick={() => handleGradeTask(studentUid)} className="bg-purple-600 hover:bg-purple-700 text-white border-none shadow-purple-500/30 gap-1"><CheckSquare size={16}/> Simpan</Button>
                                             </div>
                                         </div>
                                     ))
                                 )}
                             </div>
                         )}
                     </div>
                 );
                 
             case 'pemisah': return <div className="w-full aspect-video bg-gradient-to-br from-slate-800 to-[#0B1120] border-4 border-slate-700 rounded-2xl flex flex-col items-center justify-center p-8 text-center shadow-2xl relative overflow-hidden"><div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div><FolderOpen size={64} className="text-slate-400 mb-6 relative z-10"/><h3 className="text-3xl sm:text-4xl font-black mb-3 text-white tracking-widest relative z-10 uppercase">{activeModul.title}</h3><p className="text-sm text-slate-400 max-w-lg leading-relaxed relative z-10">Ini adalah penanda babak baru. Silakan klik <b>"Tandai Selesai"</b> di bawah untuk melanjutkan ke materi berikutnya.</p></div>;

             default: return <div className="w-full aspect-video bg-emerald-50 border-2 border-emerald-100 rounded-2xl flex flex-col items-center justify-center p-6 text-center shadow-inner"><AppWindow size={64} className="text-emerald-500 mb-4"/><h3 className="text-2xl font-black mb-2 text-emerald-900">Tautan Eksternal</h3><p className="text-sm text-emerald-600/80 mb-6">Materi ini diarahkan ke halaman atau aplikasi web pihak ketiga.</p><Button size="lg" className="bg-emerald-600 hover:bg-emerald-700 shadow-emerald-500/30 border-none" onClick={() => window.open(activeModul.url, '_blank')}><Link2 size={20} className="mr-2"/> Buka di Tab Baru</Button></div>;
         }
      };

      const isCompleted = activeModul && (userProgress || []).includes(activeModul.id);
      const isQuiz = activeModul?.type === 'kuis';
      const isQuizPassed = isQuiz && quizScore !== null && quizScore >= 70;
      const isTugas = activeModul?.type === 'tugas';
      const isTugasSubmitted = isTugas && taskSubmissions[uid] !== undefined;
      const canMarkComplete = (isQuiz && isQuizPassed) || (isTugas && isTugasSubmitted) || (!isQuiz && !isTugas);
      const lockMessage = isQuiz ? "Lulus Kuis Untuk Selesai" : (isTugas ? "Kumpulkan Tugas Untuk Selesai" : "Tandai Selesai");

      return (
         <div className="p-4 md:p-6 lg:p-8 w-full max-w-7xl mx-auto space-y-6 pb-24">
            <div className="flex items-center justify-between mb-2 border-b border-slate-200 pb-4">
               <button onClick={onBack} className="flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-blue-600"><ArrowLeft size={16}/> Kembali ke Dashboard</button>
               <h2 className="font-black text-slate-900 hidden sm:block">{program.title}</h2>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
               <div className="lg:col-span-2 space-y-6">
                  {renderMainViewer()}
                  
                  {activeModul && (
                      <div className="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start gap-4">
                         <div className="flex-1">
                            <Badge variant="slate" className="!text-[10px] uppercase mb-3">{activeModul.type.replace('_', ' ')}</Badge>
                            <h1 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white mb-2">{activeModul.title}</h1>
                            <p className="text-slate-600 text-sm">{activeModul.desc}</p>
                         </div>
                         
                         <div className="shrink-0 w-full sm:w-auto mt-2 sm:mt-0">
                            {(role === 'admin' || role === 'guru') ? (
                                <Button size="md" variant="white" className="w-full sm:w-auto bg-blue-50 border border-blue-200 text-blue-600 cursor-default pointer-events-none">
                                    <ShieldCheck size={18} className="mr-2"/> Akses Pengajar (Memantau)
                                </Button>
                            ) : (
                                isCompleted ? (
                                    <Button size="md" variant="white" className="w-full sm:w-auto bg-emerald-50 border border-emerald-200 text-emerald-600 cursor-default pointer-events-none">
                                        <CheckCircle size={18} className="mr-2"/> Selesai Dipelajari
                                    </Button>
                                ) : (
                                    (isQuiz || isTugas) ? (
                                        <Button size="md" className={`w-full sm:w-auto text-white border-none transition-all ${canMarkComplete ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/30' : 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'}`} onClick={() => canMarkComplete ? onMarkComplete(program.id, activeModul.id) : null} disabled={!canMarkComplete}>
                                            {canMarkComplete ? <><Check size={18} className="mr-2"/> Tandai Selesai</> : <><Lock size={18} className="mr-2"/> {lockMessage}</>}
                                        </Button>
                                    ) : (
                                        <Button size="md" className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white border-none shadow-blue-500/30" onClick={() => onMarkComplete(program.id, activeModul.id)}>
                                            <Check size={18} className="mr-2"/> Tandai Selesai
                                        </Button>
                                    )
                                )
                            )}
                         </div>
                      </div>
                  )}

                  {activeModul && (
                      <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                         <div className="p-4 sm:p-5 border-b border-slate-100 flex items-center gap-2 bg-slate-50 dark:bg-slate-950">
                            <MessageSquare size={20} className="text-blue-500" />
                            <h3 className="font-bold text-slate-900 dark:text-white">Ruang Tanya Jawab</h3>
                         </div>
                         <div className="p-4 sm:p-5 h-64 overflow-y-auto custom-scrollbar flex flex-col gap-4 bg-slate-50/50 dark:bg-slate-900/50">
                            {discussions.length === 0 ? (
                                <div className="m-auto text-center text-slate-400 text-sm">Belum ada diskusi. Jadilah yang pertama bertanya!</div>
                            ) : (
                                discussions.map((d, i) => {
                                    const isAdminGuru = d.role === 'admin' || d.role === 'guru';
                                    return (
                                    <div key={i} className={`flex flex-col max-w-[85%] ${isAdminGuru ? 'self-end' : 'self-start'}`}>
                                        <div className="flex items-center gap-2 mb-1 px-1">
                                            <span className="text-[10px] font-bold text-slate-500">{d.sender}</span>
                                            {isAdminGuru && <Badge variant={d.role === 'admin' ? 'purple' : 'blue'} className="!text-[8px] !py-0.5 !px-1.5 uppercase">{d.role}</Badge>}
                                        </div>
                                        <div className={`p-3 rounded-2xl text-sm ${isAdminGuru ? 'bg-blue-600 text-white rounded-tr-sm shadow-blue-500/20' : 'bg-white border border-slate-200 text-slate-700 rounded-tl-sm'} shadow-sm`}>{d.text}</div>
                                    </div>
                                )})
                            )}
                         </div>
                         <form onSubmit={handleSendComment} className="p-3 sm:p-4 bg-white dark:bg-slate-900 border-t border-slate-200 flex gap-2 items-end">
                             <textarea rows="1" placeholder="Tulis pertanyaan atau tanggapan..." value={comment} onChange={e => setComment(e.target.value)} className="flex-1 max-h-32 min-h-[44px] p-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm resize-none custom-scrollbar" onKeyDown={(e) => {if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendComment(e); }}}></textarea>
                             <Button type="submit" size="sm" className="h-[44px] w-[44px] !p-0 shrink-0 rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/30 border-none" disabled={!comment.trim()}><Send size={18}/></Button>
                         </form>
                      </div>
                  )}
               </div>

               <div className="space-y-4">
                  <h3 className="font-bold text-lg flex items-center gap-2"><List size={20} className="text-blue-500"/> Urutan Tahapan</h3>
                  <Card className="p-0 overflow-hidden shadow-sm border border-slate-200 flex flex-col relative">
                     <div className="absolute left-[31px] top-6 bottom-6 w-0.5 bg-slate-200 z-0 hidden sm:block"></div>
                     {modules.map((modul, index) => {
                         const Meta = getModulMeta(modul.type); const ModulIcon = Meta.icon;
                         const isActive = activeModul && activeModul.id === modul.id;
                         const isModulCompleted = (userProgress || []).includes(modul.id);
                         return (
                         <div key={modul.id} onClick={() => setActiveModul(modul)} className={`p-4 border-b border-slate-100 flex items-center gap-4 transition-colors relative z-10 bg-white cursor-pointer hover:bg-slate-50 ${isActive ? 'bg-blue-50' : ''}`}>
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 font-bold text-xs border-2 z-10 bg-white transition-colors ${isModulCompleted ? 'border-emerald-500 bg-emerald-50 text-emerald-600' : (isActive ? 'border-blue-600 text-blue-600' : 'border-slate-300 text-slate-400')}`}>
                               {isModulCompleted ? <Check size={16} strokeWidth={3}/> : index + 1}
                            </div>
                            <div className="flex-1 min-w-0">
                                <span className={`text-sm block truncate ${isActive ? 'text-blue-700 font-bold' : (isModulCompleted ? 'text-emerald-700 font-bold' : 'text-slate-700 font-medium')}`}>{modul.title}</span>
                                <span className="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1 mt-1"><ModulIcon size={12} className={Meta.color}/> {Meta.label}</span>
                            </div>
                         </div>
                     )})}
                  </Card>
               </div>
            </div>
         </div>
      );
    };

    const SertifikatViewer = ({ course, userName, onBack }) => {
        const [isGenerating, setIsGenerating] = useState(false);

        const handlePrint = () => {
            if (typeof window.html2pdf === 'undefined') {
                alert("Sistem pembuat PDF sedang dimuat, mohon tunggu beberapa detik lalu coba lagi.");
                return;
            }
            
            setIsGenerating(true);
            const element = document.getElementById('printable-certificate');
            
            const opt = {
                margin:       0,
                filename:     `Sertifikat_RBA_${userName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            window.html2pdf().set(opt).from(element).save().then(() => {
                setIsGenerating(false);
            }).catch(err => {
                console.error("Gagal cetak PDF:", err);
                setIsGenerating(false);
                alert("Terjadi kesalahan saat membuat file PDF.");
            });
        };

        return (
            <div className="p-4 md:p-6 lg:p-8 w-full mx-auto animate-fade-in pb-24 relative min-h-screen bg-slate-100">
                <div className="max-w-5xl mx-auto flex justify-between items-center mb-6 print:hidden">

                    <Button onClick={handlePrint} disabled={isGenerating} className="bg-amber-500 hover:bg-amber-600 text-white shadow-amber-500/30 border-none gap-2">
                        {isGenerating ? <Loader2 size={18} className="animate-spin"/> : <Printer size={18}/>}

                <div id="printable-certificate" className="max-w-[1000px] mx-auto bg-white aspect-[1.414/1] relative shadow-2xl overflow-hidden border-[16px] border-slate-900 p-8 sm:p-16 flex flex-col items-center justify-center text-center">
                    <div className="absolute inset-0 opacity-5 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#000 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
                    <div className="absolute -top-32 -left-32 w-64 h-64 bg-amber-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    <div className="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

                    <div className="relative z-10 w-full flex flex-col items-center border-4 border-double border-slate-200 p-8 h-full justify-between">
                        <div>
                            <div className="flex justify-center items-center gap-3 mb-6">
                                <img src="https://i.ibb.co.com/Tx2C8J3Y/ENSIKLOPEDIA-39.png" alt="Logo" className="h-16" />
                                <div className="text-left"><h2 className="text-xl font-black text-slate-900 tracking-wider">RUMAH BAHASA ARAB</h2><p className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Platform Belajar Interaktif</p></div>
                            </div>
                            <h1 className="text-4xl sm:text-6xl text-amber-500 mb-2 mt-4 tracking-widest font-serif" style={{ fontFamily: "'Merriweather', serif" }}>SERTIFIKAT</h1>
                            <p className="text-sm font-bold text-slate-400 tracking-widest uppercase mb-10">Penghargaan Pencapaian Akademik</p>
                        </div>
                        <div className="w-full max-w-2xl">
                            <p className="text-slate-500 text-sm mb-2 italic">Diberikan secara resmi kepada:</p>
                            <h2 className="text-3xl sm:text-5xl font-black text-slate-900 mb-6 border-b-2 border-slate-200 pb-4 inline-block px-12 capitalize">{userName}</h2>
                            <p className="text-slate-600 text-sm sm:text-base leading-relaxed max-w-xl mx-auto mb-2">Atas dedikasi dan keberhasilannya dalam menyelesaikan seluruh rangkaian materi dan tahapan belajar pada program:</p>
                            <h3 className="text-xl sm:text-2xl font-bold text-blue-700 mb-8 font-serif">"{course.title}"</h3>
                        </div>
                        <div className="w-full flex justify-between items-end px-10 mt-auto">
                            <div className="text-center">
                                <p className="text-slate-400 text-xs mb-2">Tanggal Lulus</p>
                                <p className="font-bold text-slate-800 border-t border-slate-300 pt-2 px-6">{new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                            </div>
                            <div className="w-24 h-24 rounded-full border-4 border-amber-400 flex items-center justify-center relative bg-white shadow-lg shadow-amber-500/20">
                                <div className="w-20 h-20 rounded-full border border-amber-200 flex items-center justify-center bg-amber-50"><Award size={32} className="text-amber-500"/></div>
                                <div className="absolute -bottom-4 bg-amber-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Verified</div>
                            </div>
                            <div className="text-center">
                                <p className="text-slate-400 text-xs mb-2">Pimpinan RBA</p>

            const matchSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase()) || (item.desc && item.desc.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchType = typeFilter === 'Semua' ? true : item.type === typeFilter;
            return matchSearch && matchType;
        });

        return (
            <div className="p-4 md:p-6 lg:p-8 w-full max-w-7xl mx-auto space-y-6 md:space-y-8 animate-slide-up pb-24 overflow-x-hidden">
                <div className="text-center mb-6 md:mb-10 px-2 sm:px-4">
                    <Badge variant="blue" className="mx-auto mb-3 sm:mb-4 text-[10px] sm:text-xs">LITERASI DIGITAL</Badge>
                    <h1 className="text-xl sm:text-3xl lg:text-4xl font-black text-slate-900 dark:text-white mb-2 sm:mb-4 leading-tight">Perpustakaan RBA</h1>
                    <p className="text-slate-500 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">Nikmati akses tak terbatas ke ragam koleksi kitab, literatur ilmu syar'i, hingga berbagai <span className="font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-[#06B6D4] to-emerald-500">aplikasi edukatif</span> yang dirancang khusus untuk memperkaya pengalaman belajar Anda.</p>

                {libraryData.length === 0 ? (
                    <div className="text-center py-16 bg-white dark:bg-slate-900 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-3xl text-slate-500 shadow-sm">
                        <BookMarked size={48} className="mx-auto mb-4 text-slate-300" />
                        <h3 className="font-bold text-lg mb-2 text-slate-700 dark:text-slate-300">Koleksi Sedang Disiapkan</h3>
                        <p className="text-sm">Buku dan literatur digital sedang dalam proses kurasi oleh tim pengajar.</p>
                    </div>
                ) : filteredLibrary.length === 0 ? (
                    <div className="text-center py-16 bg-white dark:bg-slate-900 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-3xl text-slate-500 shadow-sm">
                        <Search size={40} className="mx-auto mb-3 text-slate-300" />
                        <h3 className="font-bold text-lg mb-2 text-slate-700 dark:text-slate-300">Hasil Tidak Ditemukan</h3>
                        <p className="text-sm">Coba gunakan kata kunci lain atau ubah filter format file.</p>
                    </div>
                ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
                        {filteredLibrary.map((item, i) => (
                            <Card key={i} className="p-0 flex flex-col justify-between border-2 border-slate-200 dark:border-slate-800 transition-all overflow-hidden hover:shadow-xl hover:-translate-y-1">
                                <div className="h-40 sm:h-48 relative bg-slate-100 dark:bg-slate-800">
