    const ManajemenPerpustakaanAdmin = ({ libraryData, db, storage }) => {
        const [view, setView] = useState('list');
        const [formData, setFormData] = useState({ id: '', title: '', desc: '', type: 'Kitab PDF', url: '', coverUrl: '' });
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [isUploading, setIsUploading] = useState(false);
        const [uploadMsg, setUploadMsg] = useState('');

        const handleAdd = () => { setFormData({ id: 'lib_' + Date.now().toString(36), title: '', desc: '', type: 'Kitab PDF', url: '', coverUrl: '' }); setUploadMsg(''); setView('form'); };
        const handleEdit = (item) => { setFormData(item); setUploadMsg(''); setView('form'); };
        
        const handleDelete = async (id) => {
            if(!window.confirm('Hapus koleksi ini dari perpustakaan?')) return;
            try {
                const updated = libraryData.filter(item => item.id !== id);
                await updateDoc(doc(db, "rba_lms", "main_db"), { library: updated });
            } catch(e) { console.error("Gagal hapus:", e); }
        };

        const handleUpload = async (e, field) => {
            const file = e.target.files[0];
            if(!file || !storage) return;
            setIsUploading(true); setUploadMsg('Sedang mengunggah file...');
            try {
                const safeFileName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
                const storageRef = ref(storage, `library/${Date.now()}_${safeFileName}`);
                const snapshot = await uploadBytes(storageRef, file);
                const url = await getDownloadURL(snapshot.ref);
                setFormData(prev => ({...prev, [field]: url}));
                setUploadMsg('Sukses: File berhasil diunggah!');
            } catch (error) { setUploadMsg(`Error: Gagal mengunggah (${error.message}).`); }
            setIsUploading(false);
        };

        const handleSave = async (e) => {
            e.preventDefault(); setIsSubmitting(true);
            try {
                let updated = [...libraryData];
                const existingIdx = updated.findIndex(c => c.id === formData.id);
                if (existingIdx >= 0) { updated[existingIdx] = formData; } else { updated.push(formData); }
                await setDoc(doc(db, "rba_lms", "main_db"), { library: updated }, { merge: true });
                setView('list');
            } catch(error) { console.error(error); }
            setIsSubmitting(false);
        };

        if (view === 'form') {
            return (
                <div className="p-4 md:p-6 w-full max-w-3xl mx-auto space-y-6 animate-slide-up pb-24">
                   <div className="flex items-center gap-4 mb-6">
                      <button onClick={() => setView('list')} className="p-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 rounded-full"><ArrowLeft size={20} /></button>
                      <h1 className="text-2xl font-black text-slate-900 dark:text-white">{formData.id && formData.id.startsWith('lib_') && !libraryData.find(l=>l.id===formData.id) ? 'Tambah Koleksi Baru' : 'Edit Koleksi'}</h1>
                   </div>
                   <form onSubmit={handleSave} className="space-y-5 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm">
                      <div><label className="block text-sm font-bold mb-2">Judul Buku / Materi</label><input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm" /></div>
                      <div><label className="block text-sm font-bold mb-2">Deskripsi Singkat</label><textarea required rows="3" value={formData.desc} onChange={e => setFormData({...formData, desc: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm resize-none"></textarea></div>
                      
                      <div>
                          <label className="block text-sm font-bold mb-2">Jenis File / Format</label>
                          <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-blue-600 text-sm">
                              <option value="Kitab PDF">Kitab PDF / Dokumen</option>
                              <option value="Artikel Web">Artikel Web</option>
                              <option value="Video Kajian">Video Kajian</option>
                              <option value="Audio MP3">Audio MP3</option>
                              <option value="Aplikasi">Aplikasi Edukatif</option>
                          </select>
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                         <label className="block text-sm font-bold mb-2">File Sumber / URL Tautan</label>
                         <input type="file" onChange={(e) => handleUpload(e, 'url')} disabled={isUploading} className="mb-3 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-100 file:text-blue-700" />
                         <input type="text" required placeholder="Atau paste URL langsung di sini..." value={formData.url} onChange={e => setFormData({...formData, url: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600 text-sm" />
                      </div>

                      <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-700">
                         <label className="block text-sm font-bold mb-2">Gambar Sampul (Opsional)</label>
                         <input type="file" accept="image/*" onChange={(e) => handleUpload(e, 'coverUrl')} disabled={isUploading} className="mb-3 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-100 file:text-blue-700" />
                         <input type="text" placeholder="Atau paste URL gambar sampul di sini..." value={formData.coverUrl} onChange={e => setFormData({...formData, coverUrl: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:ring-2 focus:ring-blue-600 text-sm" />
                         {uploadMsg && <p className={`mt-2 text-xs font-bold ${uploadMsg.includes('Error') ? 'text-rose-600' : 'text-blue-600'}`}>{uploadMsg}</p>}
                      </div>

                      <div className="pt-4 flex justify-end gap-3 border-t border-slate-100 dark:border-slate-800">
                         <Button type="button" variant="ghost" onClick={() => setView('list')}>Batal</Button>
                         <Button type="submit" disabled={isSubmitting || isUploading} className="gap-2 border-none bg-blue-600 hover:bg-blue-700"><Save size={18}/> Simpan Koleksi</Button>
                      </div>
                   </form>
                </div>
            );
        }

        return (
            <div className="p-4 md:p-6 w-full max-w-7xl mx-auto space-y-6 animate-slide-up pb-24">
                <div className="flex justify-between items-end mb-6">
                    <div>
                        <Badge variant="blue" className="mb-2">MANAJEMEN KONTEN</Badge>
                        <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">Kelola Perpustakaan</h1>
                    </div>
                    <Button onClick={handleAdd} className="gap-2 border-none bg-blue-600 hover:bg-blue-700 text-white"><PlusCircle size={18}/> Tambah</Button>
                </div>
                
                {libraryData.length === 0 ? (
                    <div className="text-center py-16 bg-white dark:bg-slate-900 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-3xl text-slate-500">
                        <BookMarked size={48} className="mx-auto mb-4 text-slate-300" />
                        Perpustakaan masih kosong. Klik Tambah untuk mengunggah kitab atau artikel.
                    </div>
                ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {libraryData.map((item, i) => (
                            <Card key={i} className="p-0 flex flex-col justify-between overflow-hidden border-2 border-slate-200">
                                <div className="h-32 relative bg-slate-100 flex items-center justify-center">
                                    {item.coverUrl ? <img src={item.coverUrl} className="absolute inset-0 w-full h-full object-cover" /> : <BookMarked size={28} className="text-slate-300"/>}
                                    <Badge variant="blue" className="absolute top-2 left-2 !text-[9px] uppercase shadow-sm bg-white/90">{item.type}</Badge>
                                </div>
                                <div className="p-4 flex-1 flex flex-col">
                                    <h3 className="font-bold text-base mb-2 line-clamp-2 text-slate-900 dark:text-white">{item.title}</h3>
                                    <div className="flex justify-between items-center mt-auto pt-4 border-t border-slate-100">
                                        <button onClick={() => window.open(item.url, '_blank')} className="text-xs font-bold text-blue-600 hover:underline">Buka Link</button>
                                        <div className="flex gap-1">
                                            <button onClick={() => handleEdit(item)} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg"><PenTool size={16}/></button>
                                            <button onClick={() => handleDelete(item.id)} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg"><Trash2 size={16}/></button>
                                        </div>
                                    </div>
                                </div>
                            </Card>
                        ))}
                    </div>
                )}
            </div>
        );
    };

    const InstallPrompt = () => {
        const [showPrompt, setShowPrompt] = useState(false);
        const [isIOS, setIsIOS] = useState(false);
        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [showManualGuide, setShowManualGuide] = useState(false); // State baru untuk Modal Panduan

        useEffect(() => {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            if (isStandalone) return;

            const hasDismissed = sessionStorage.getItem('rba_dismiss_install');
            if (hasDismissed) return;

            const ua = window.navigator.userAgent;
            const isIOSDevice = !!ua.match(/iPad/i) || !!ua.match(/iPhone/i);
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);

            if (!isMobile) return;

            if (isIOSDevice) {
                setIsIOS(true);
            }

            const timerId = setTimeout(() => setShowPrompt(true), 3500);

            const handleBeforeInstallPrompt = (e) => {
                e.preventDefault();
                setDeferredPrompt(e);
            };

            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

            return () => {
                clearTimeout(timerId);
                window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            };
        }, []);

        const handleInstallClick = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    setShowPrompt(false);
                }
                setDeferredPrompt(null);
            } else {
                // PERBAIKAN PENTING: Gunakan UI Pop-up internal, BUKAN alert() agar tembus di Google Sites
                setShowManualGuide(true);
            }
        };

        const handleDismiss = () => {
            setShowPrompt(false);
            sessionStorage.setItem('rba_dismiss_install', 'true');
        };

        if (!showPrompt && !showManualGuide) return null;

        return (
            <>
            {/* Banner Tawaran Install */}
            {showPrompt && !showManualGuide && (
                <div className="fixed bottom-0 left-0 w-full z-[200] p-4 sm:p-6 animate-slide-up">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 sm:p-5 rounded-2xl shadow-2xl flex flex-col sm:flex-row items-center gap-4 max-w-3xl mx-auto relative overflow-hidden">
                        <div className="absolute top-2 right-2 sm:top-4 sm:right-4">
                            <button onClick={handleDismiss} className="text-slate-400 hover:text-rose-500 bg-slate-100 dark:bg-slate-800 hover:bg-rose-50 rounded-full p-1.5 transition-colors">
                                <X size={16} />
                            </button>
                        </div>
                        
                        <img src="https://i.ibb.co.com/Tx2C8J3Y/ENSIKLOPEDIA-39.png" alt="Logo RBA" className="w-12 h-12 sm:w-16 sm:h-16 shrink-0 drop-shadow-md" />
                        
                        <div className="flex-1 text-center sm:text-left pr-4">
                            <h3 className="font-black text-slate-900 dark:text-white text-base sm:text-lg mb-1">Pasang Aplikasi RBA</h3>
                            {isIOS ? (
                                <p className="text-xs sm:text-sm text-slate-500 leading-relaxed">Ketuk tombol <Share2 size={14} className="inline mx-1 text-blue-500"/> (Bagikan) di bawah, lalu pilih <strong>"Tambahkan ke Layar Utama"</strong> untuk akses super cepat.</p>
                            ) : (
                                <p className="text-xs sm:text-sm text-slate-500 leading-relaxed">Pasang aplikasi ini ke Layar Utama HP Anda. Akses lebih cepat, ringan, dan hemat kuota.</p>
                            )}
                        </div>

                        {!isIOS && (
                            <div className="w-full sm:w-auto shrink-0 mt-3 sm:mt-0">
                                <Button onClick={handleInstallClick} className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/30 border-none whitespace-nowrap">
                                    <Download size={18} className="mr-2"/> Pasang Sekarang
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            )}

            {/* Modal Panduan Manual (Pengganti Alert) */}
            {showManualGuide && (
               <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[250] flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-slate-200 dark:border-slate-700 animate-slide-up text-center">
                     <div className="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <Smartphone size={32} />
                     </div>
                     <h2 className="text-xl font-black mb-2 text-slate-900 dark:text-white">Panduan Pemasangan</h2>
                     <p className="text-sm text-slate-500 mb-6 leading-relaxed">
                        Browser Anda memblokir pemasangan otomatis. Mohon pasang secara manual:
                        <br/><br/>
                        1. Ketuk ikon Menu (titik tiga <b>⋮</b>) di pojok kanan atas browser.<br/>
                        2. Pilih <b>"Tambahkan ke Layar Utama"</b> (Add to Home screen) atau <b>"Instal Aplikasi"</b>.
                     </p>
                     <Button onClick={() => { setShowManualGuide(false); setShowPrompt(false); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/30 border-none">Saya Mengerti</Button>
                  </div>
               </div>
            )}
            </>
        );
    };

    function App() {
      const defaultUsers = { 'ADMIN-RBA': { role: 'admin', name: 'Admin Utama RBA' } };
      
      // SUNTIKAN MASTER: Data Demo Otomatis untuk menguji 6 Jenis Materi
      const defaultDemoCourses = [
        {
          id: 'crs_demo_master',
          title: 'Demo Master: 6 Jenis Materi RBA',
          desc: 'Program ini dibuat otomatis oleh sistem. Berisi contoh 6 jenis tahapan materi (YouTube, Video Internal, Zoom, Modul PDF, Kuis, dan Tugas Upload) agar Anda bisa langsung menguji coba tanpa membuat dari nol. Silakan edit atau hapus program ini nanti di Manajemen Program.',
          kategori: "Ulum Syar'i",
          status: 'Aktif',
          coverUrl: 'https://images.unsplash.com/photo-1585036156171-384164a8c675?auto=format&fit=crop&q=80&w=800',
          modules: [
            { id: 'mdl_demo_1', title: '1. Video YouTube', desc: 'Sistem akan otomatis mengubah link biasa menjadi mode tonton (embed).', type: 'youtube', url: 'https://www.youtube.com/watch?v=9xwazD5SyVg', questions: [] },
            { id: 'mdl_demo_2', title: '2. Video Internal (MP4)', desc: 'Bisa memutar file MP4 secara langsung atau link dari Google Drive.', type: 'video_upload', url: 'https://www.w3schools.com/html/mov_bbb.mp4', questions: [] },
            { id: 'mdl_demo_3', title: '3. Sesi Zoom/Meet', desc: 'Kartu khusus yang mengarahkan santri untuk bergabung ke tatap muka virtual.', type: 'zoom', url: 'https://zoom.us/j/1234567890', questions: [] },
            { id: 'mdl_demo_4', title: '4. Modul PDF / MPI', desc: 'Kartu yang mengarahkan santri untuk membaca dokumen/buku digital.', type: 'pdf', url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf', questions: [] },
            { id: 'mdl_demo_5', title: '5. Evaluasi Kuis', desc: 'Contoh kuis pilihan ganda otomatis (Passing grade 70).', type: 'kuis', url: '', questions: [
                { q: 'Apa rukun Islam yang pertama?', options: ['Shalat', 'Syahadat', 'Zakat', 'Puasa'], ans: 1 },
                { q: 'Siapa malaikat yang bertugas menyampaikan wahyu?', options: ['Mikail', 'Israfil', 'Jibril', 'Izrail'], ans: 2 },
                { q: 'Berapa jumlah rakaat shalat wajib dalam sehari semalam?', options: ['15', '16', '17', '18'], ans: 2 }
              ] 
            },
            { id: 'mdl_demo_6', title: '6. Tugas Praktik (Upload)', desc: 'Santri diminta mengirimkan tautan Google Drive berisi tugas mereka.', type: 'tugas', url: '', questions: [] }
          ]
        }
      ];

      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [role, setRole] = useState('siswa'); 
      const [userName, setUserName] = useState('');
      const [currentUserToken, setCurrentUserToken] = useState('');
      const [currentUserUid, setCurrentUserUid] = useState('');
      const [activeMenu, setActiveMenu] = useState('dashboard');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(() => getSafeLocal('rba_theme', false));
      const [lang, setLang] = useState(() => getSafeLocal('rba_lang', 'id'));
      
      const [selectedProgram, setSelectedProgram] = useState(null);
      const [selectedClassroom, setSelectedClassroom] = useState(null);

      const [courses, setCourses] = useState(() => {
          const local = getSafeLocal('rba_courses', []);
          return local.length > 0 ? local : defaultDemoCourses;
      });
      const [enrollments, setEnrollments] = useState(() => getSafeLocal('rba_enrollments', {}));
      const [usersData, setUsersData] = useState(() => getSafeLocal('rba_users', defaultUsers));
      const [pengumuman, setPengumuman] = useState('');
      const [schedules, setSchedules] = useState(() => getSafeLocal('rba_schedules', [])); 
      
      const [registrations, setRegistrations] = useState(() => getSafeLocal('rba_registrations', {}));
      const [libraryData, setLibraryData] = useState(() => getSafeLocal('rba_library', []));
      
      const [showNotifications, setShowNotifications] = useState(false);
      
      const [firebaseStatus, setFirebaseStatus] = useState('offline');
      const [isAppInitializing, setIsAppInitializing] = useState(true);

      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
        setSafeLocal('rba_theme', darkMode);
      }, [darkMode]);

      useEffect(() => { setSafeLocal('rba_lang', lang); }, [lang]);
      useEffect(() => { setSafeLocal('rba_schedules', schedules); }, [schedules]); 
      useEffect(() => { setSafeLocal('rba_registrations', registrations); }, [registrations]); 
      useEffect(() => { setSafeLocal('rba_library', libraryData); }, [libraryData]); 

      const handleRequestAccess = async (courseId) => {
         if(!currentUserUid || !db) return;
         
         setEnrollments(prev => ({...prev, [currentUserUid]: {...prev[currentUserUid], classes: {...(prev[currentUserUid]?.classes || {}), [courseId]: 'pending'} } }));

         try {
            await updateDoc(doc(db, "rba_lms", "main_db"), {
                [`enrollments.${currentUserUid}.classes.${courseId}`]: 'pending'
            });
         } catch (e) { 
            console.error("Gagal minta akses jalur utama (Mencoba jalur cadangan):", e); 
            try { 
                await setDoc(doc(db, "rba_lms", "main_db"), {
                    enrollments: { [currentUserUid]: { classes: { [courseId]: 'pending' } } }
                }, { merge: true });
            } catch(err) {}
         }
      };

      const handleMarkComplete = async (courseId, moduleId) => {
         if(!currentUserUid || !db) return;
         try {
             const currentProgress = enrollments[currentUserUid]?.progress?.[courseId] || [];
             if (!currentProgress.includes(moduleId)) {
                 const newProgress = [...currentProgress, moduleId];
                 
                 await setDoc(doc(db, "rba_lms", "main_db"), {
                     enrollments: {
                         [currentUserUid]: {
                             progress: {
                                 [courseId]: newProgress
                             }
                         }
                     }
                 }, { merge: true });
                 
                 setEnrollments(prev => ({ ...prev, [currentUserUid]: { ...prev[currentUserUid], progress: { ...(prev[currentUserUid]?.progress || {}), [courseId]: newProgress } } }));
             }
         } catch (e) { console.error("Gagal tandai selesai:", e); }
      };

      useEffect(() => {
          if (!db) { setFirebaseStatus('error'); setIsAppInitializing(false); return; }
          setFirebaseStatus('connecting');
          const timeoutId = setTimeout(() => { if (isAppInitializing) setIsAppInitializing(false); }, 3000);

          const unsub = onSnapshot(doc(db, "rba_lms", "main_db"), (docSnap) => {
              if(docSnap.exists()) {
                  const data = docSnap.data();
                  
// LOGIKA PENGAMBILAN DATA KURSUS (INJEKSI DEMO SUDAH DIMATIKAN)
            if(data.courses) {
                setCourses(data.courses);
            } else {
                setCourses([]); // Biarkan kosong jika memang tidak ada data, jangan diisi demo
            }

            if(data.enrollments) setEnrollments(data.enrollments);
            if(data.users && Object.keys(data.users).length > 0) setUsersData(data.users);
            if(data.pengumuman !== undefined) setPengumuman(data.pengumuman);
            if(data.schedules) setSchedules(data.schedules); else setSchedules([]);
            if(data.registrations) setRegistrations(data.registrations); else setRegistrations({});
            if(data.library) setLibraryData(data.library); else setLibraryData([]);
        } else {
            // Inisiasi database awal jika sama sekali belum pernah dibuat (Tanpa Demo Kursus)
            try { setDoc(doc(db, "rba_lms", "main_db"), { courses: [], users: defaultUsers }, { merge: true }); } catch(e) {}
        }
            setFirebaseStatus('online'); clearTimeout(timeoutId); setIsAppInitializing(false);
          }, (error) => { setFirebaseStatus('error'); clearTimeout(timeoutId); setIsAppInitializing(false); });
          return () => unsub();
      }, []);

      const handleLoginSuccess = (selectedRole, name, token, uid) => {
        setRole(selectedRole); setUserName(name); setCurrentUserToken(token); setCurrentUserUid(uid); setIsLoggedIn(true); setActiveMenu('dashboard');
      };
      
      const handleLogout = () => { setIsLoggedIn(false); setRole('siswa'); setCurrentUserToken(''); setCurrentUserUid(''); };

      const safeCourses = Array.isArray(courses) ? courses : [];
      const safeEnrollments = enrollments || {};
      const siswaData = safeEnrollments[currentUserUid] || {};
      const safeClasses = siswaData.classes || {};
      const userProgressData = siswaData.progress || {};

      const allCoursesView = safeCourses.map(c => {
          let totalUsers = 0;
          Object.values(safeEnrollments).forEach(student => { if(student && student.classes && student.classes[c.id] === 'approved') totalUsers++; });
          return { ...c, users: totalUsers, enrolledBySiswa: !!safeClasses[c.id], enrollmentStatus: safeClasses[c.id] || '' };
      });
      const myCoursesView = allCoursesView.filter(c => c.enrolledBySiswa);

      const renderContent = () => {
        switch (activeMenu) {
          case 'dashboard': 
            if (role === 'admin') return <DashboardAdmin setActiveMenu={setActiveMenu} courses={allCoursesView} userName={userName} usersData={usersData} pengumuman={pengumuman} db={db} />;
            if (role === 'guru') return <DashboardGuru setActiveMenu={setActiveMenu} courses={myCoursesView} userName={userName} schedules={schedules} />;
            return <DashboardSiswa setActiveMenu={setActiveMenu} myCourses={myCoursesView} userName={userName} pengumuman={pengumuman} enrollmentsData={safeEnrollments} uid={currentUserUid} onGoToClass={(c) => { setSelectedClassroom(c); setActiveMenu('ruang-kelas'); }} onShowSertifikat={(c) => { setSelectedClassroom(c); setActiveMenu('sertifikat'); }} schedules={schedules} />;
          case 'katalog-program': return <KatalogProgramSiswa setActiveMenu={setActiveMenu} courses={allCoursesView} onViewDetail={(prog) => { setSelectedProgram(prog); setActiveMenu('detail-program'); }} />;
          case 'perpustakaan': return <PerpustakaanDigital libraryData={libraryData} />;
          case 'detail-program': return <DetailProgram program={selectedProgram || allCoursesView.find(c => c.id === selectedProgram?.id)} onBack={() => setActiveMenu('katalog-program')} role={role} enrollmentStatus={selectedProgram ? (safeClasses[selectedProgram.id] || '') : ''} onEnroll={handleRequestAccess} onManage={() => setActiveMenu('manajemen-program')} onGoToClass={() => { setSelectedClassroom(selectedProgram); setActiveMenu('ruang-kelas'); }} />;
          case 'ruang-kelas': return <RuangKelas program={selectedClassroom} onBack={() => setActiveMenu('kelas-saya')} userProgress={userProgressData[selectedClassroom?.id] || []} onMarkComplete={handleMarkComplete} role={role} userName={userName} db={db} uid={currentUserUid} storage={storage} enrollments={safeEnrollments} />;
          case 'kelas-saya': return <DashboardSiswa setActiveMenu={setActiveMenu} myCourses={myCoursesView} userName={userName} pengumuman={pengumuman} enrollmentsData={safeEnrollments} uid={currentUserUid} onGoToClass={(c) => { setSelectedClassroom(c); setActiveMenu('ruang-kelas'); }} onShowSertifikat={(c) => { setSelectedClassroom(c); setActiveMenu('sertifikat'); }} schedules={schedules} />;
          case 'papan-peringkat': return <PapanPeringkat usersData={usersData} enrollments={safeEnrollments} courses={safeCourses} currentUserUid={currentUserUid} />;
          case 'sertifikat': return <SertifikatViewer course={selectedClassroom} userName={userName} onBack={() => setActiveMenu('profil')} />;
          case 'profil': return <ProfilDanRapor uid={currentUserUid} currentUserToken={currentUserToken} usersData={usersData} enrollmentsData={safeEnrollments} courses={safeCourses} onShowSertifikat={(c) => { setSelectedClassroom(c); setActiveMenu('sertifikat'); }} db={db} />;
          case 'jadwal-akademik': return <JadwalAkademik schedules={schedules} role={role} db={db} />;
          case 'manajemen-pengguna': return <ManajemenPenggunaAdmin usersData={usersData} enrollments={safeEnrollments} courses={safeCourses} />;
          case 'manajemen-program': return <ManajemenProgramAdmin courses={safeCourses} db={db} storage={storage} />;
          case 'manajemen-perpustakaan': return <ManajemenPerpustakaanAdmin libraryData={libraryData} db={db} storage={storage} />;
          case 'persetujuan': return <PersetujuanAdmin enrollments={safeEnrollments} courses={safeCourses} usersData={usersData} db={db} />;
          case 'validasi-pendaftaran': return <ValidasiPendaftaranAdmin registrations={registrations} db={db} usersData={usersData} courses={safeCourses} />;
          default: return <div className="p-10 text-center text-slate-500">Halaman tidak ditemukan.</div>;
        }
      };

if (isAppInitializing) return (
  <div className="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-50 dark:bg-[#001128]">
    {/* Teks dengan Gradasi dan Denyut (Pulse) */}
    <h1 className="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-blue-600 to-blue-900 bg-clip-text text-transparent dark:from-blue-400 dark:to-blue-600 animate-pulse tracking-wide mb-6">
      Rumah Bahasa Arab
    </h1>
    
    {/* Animasi Spinner */}
    <div className="relative w-16 h-16">
      <div className="absolute inset-0 border-4 border-slate-200 dark:border-slate-700 rounded-full"></div>
      <div className="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
    </div>
    
    {/* Teks Tambahan */}
    <p className="mt-6 text-slate-500 dark:text-slate-400 font-medium text-sm animate-pulse">
      Menyiapkan ruang kelas...
    </p>
  </div>
);
      if (!isLoggedIn) return (
        <ThemeContext.Provider value="admin">
           <InstallPrompt />
           <LandingPage onLogin={handleLoginSuccess} usersData={usersData} isDbReady={firebaseStatus !== 'connecting'} coursesData={courses} darkMode={darkMode} toggleDarkMode={() => setDarkMode(!darkMode)} lang={lang} setLang={setLang} pengumuman={pengumuman} libraryData={libraryData} />
        </ThemeContext.Provider>
      );

      const SidebarItem = ({ icon: Icon, label, isActive, onClick }) => {
        const themeMap = { admin: "bg-blue-600 text-white", siswa: "bg-orange-500 text-white", guru: "bg-emerald-600 text-white" };
        const activeClass = isActive ? (themeMap[role] || themeMap.admin) + " shadow-md" : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800";
        return (
          <button onClick={() => { onClick(); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold text-sm transition-all ${activeClass}`}>
            <Icon size={18} className="w-5 h-5" /> <span className="flex-1 text-left">{label}</span>
          </button>
        )
      };

      return (
        <ThemeContext.Provider value={role}>
        <InstallPrompt />
        <div className="flex h-screen overflow-hidden w-full relative bg-slate-50 dark:bg-[#0B1120]">
          {isSidebarOpen && <div className="fixed inset-0 bg-slate-900/60 z-40 lg:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}
          <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-[70vw] sm:w-72 max-w-xs bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} print:hidden`}>
            <div className="h-16 sm:h-20 flex items-center gap-3 px-6 border-b border-slate-200 dark:border-slate-800 shrink-0">
                 <img src="https://i.ibb.co.com/Tx2C8J3Y/ENSIKLOPEDIA-39.png" alt="RBA" className="h-8 w-auto" />
                 <span className="font-black text-base sm:text-lg tracking-tight truncate">Rumah Bahasa Arab</span>
            </div>
            <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5 custom-scrollbar">
              <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2">Navigasi</div>
              <SidebarItem icon={LayoutDashboard} label="Dashboard" isActive={activeMenu === 'dashboard'} onClick={() => setActiveMenu('dashboard')} />
              <SidebarItem icon={Library} label="Katalog Program" isActive={activeMenu === 'katalog-program' || activeMenu === 'detail-program'} onClick={() => setActiveMenu('katalog-program')} />
              <SidebarItem icon={BookMarked} label="Perpustakaan Digital" isActive={activeMenu === 'perpustakaan'} onClick={() => setActiveMenu('perpustakaan')} />
              <SidebarItem icon={CalendarDays} label="Kalender Akademik" isActive={activeMenu === 'jadwal-akademik'} onClick={() => setActiveMenu('jadwal-akademik')} />
              
              {role === 'siswa' && (
                <>
                   <SidebarItem icon={BookOpen} label="Kelas Saya" isActive={activeMenu === 'kelas-saya' || activeMenu === 'ruang-kelas'} onClick={() => setActiveMenu('kelas-saya')} />
                   <SidebarItem icon={Trophy} label="Papan Peringkat" isActive={activeMenu === 'papan-peringkat'} onClick={() => setActiveMenu('papan-peringkat')} />
                   <SidebarItem icon={User} label="Profil & Rapor" isActive={activeMenu === 'profil' || activeMenu === 'sertifikat'} onClick={() => setActiveMenu('profil')} />
                </>
              )}
              
              {role === 'guru' && (
                <>
                  <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2 mt-6">Ruang Pengajar</div>
                  <SidebarItem icon={FolderOpen} label="Kelola Materi Kelas" isActive={activeMenu === 'manajemen-program'} onClick={() => setActiveMenu('manajemen-program')} />
                </>
              )}
              
              {role === 'admin' && (
                <>
                  <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2 mt-6">Administrator</div>
                  <SidebarItem icon={Wallet} label="Validasi Pendaftaran" isActive={activeMenu === 'validasi-pendaftaran'} onClick={() => setActiveMenu('validasi-pendaftaran')} />
                  <SidebarItem icon={FolderOpen} label="Manajemen Program" isActive={activeMenu === 'manajemen-program'} onClick={() => setActiveMenu('manajemen-program')} />
                  <SidebarItem icon={BookMarked} label="Kelola Perpustakaan" isActive={activeMenu === 'manajemen-perpustakaan'} onClick={() => setActiveMenu('manajemen-perpustakaan')} />
                  <SidebarItem icon={Users} label="Manajemen Pengguna" isActive={activeMenu === 'manajemen-pengguna'} onClick={() => setActiveMenu('manajemen-pengguna')} />
                  <SidebarItem icon={ShieldCheck} label="Persetujuan" isActive={activeMenu === 'persetujuan'} onClick={() => setActiveMenu('persetujuan')} />
                </>
              )}
              <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2 mt-6">Akun</div>
              <SidebarItem icon={LogOut} label="Keluar Akun" onClick={handleLogout} />
            </nav>
          </aside>

          <main className="flex-1 flex flex-col min-w-0 relative w-full overflow-x-hidden">
            <header className="h-16 sm:h-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-3 sm:px-6 z-10 sticky top-0 shrink-0 print:hidden">
              <div className="flex items-center gap-3">
                <button className="lg:hidden text-slate-600 p-2 rounded-xl bg-slate-100" onClick={() => setIsSidebarOpen(true)}><Menu size={20} /></button>
                <div className="hidden sm:block font-black text-lg capitalize truncate text-slate-900 dark:text-white">{activeMenu.replace('-', ' ')}</div>
              </div>
              <div className="flex items-center gap-3">
                {firebaseStatus === 'online' ? <Badge variant="emerald" className="hidden sm:flex text-xs"><Database size={10} className="w-3 h-3"/> Terhubung</Badge> : <Badge variant="rose" className="hidden sm:flex text-xs"><ShieldAlert size={10} className="w-3 h-3"/> Offline</Badge>}
                
                {role === 'siswa' && (
                  <div className="static sm:relative">
                    <button onClick={() => setShowNotifications(!showNotifications)} className="p-2 text-slate-500 hover:text-blue-600 bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-full transition-colors mr-1 relative">
                      {(safeEnrollments[currentUserUid]?.notifications || []).some(n => !n.read) ? (
                         <>
                           <BellRing size={18} className="animate-pulse text-rose-500" />
                           <span className="absolute top-0 right-0 w-2.5 h-2.5 bg-rose-500 border-2 border-slate-100 dark:border-slate-800 rounded-full"></span>
                         </>
                      ) : (
                         <Bell size={18} />
                      )}
                    </button>
                    
                    {showNotifications && (
                        <div className="fixed top-[70px] left-1/2 -translate-x-1/2 w-[92vw] max-w-[340px] sm:absolute sm:top-[calc(100%+10px)] sm:left-auto sm:right-0 sm:translate-x-0 sm:w-80 z-[100] bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 animate-fade-in overflow-hidden origin-top sm:origin-top-right">
                             <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950">
                                <h3 className="font-black text-slate-900 dark:text-white">Notifikasi</h3>
                                {(safeEnrollments[currentUserUid]?.notifications || []).some(n => !n.read) && (
                                   <button onClick={async () => {
                                       const updatedNotifs = (safeEnrollments[currentUserUid]?.notifications || []).map(n => ({...n, read: true}));
                                       try { 
                                           await setDoc(doc(db, "rba_lms", "main_db"), {
                                               enrollments: {
                                                   [currentUserUid]: { notifications: updatedNotifs }
                                               }
                                           }, { merge: true });
                                       } catch(e) { console.error("Gagal update notif:", e); }
                                   }} className="text-[10px] font-bold text-blue-600 hover:underline">Tandai dibaca</button>
                                )}
                             </div>
                             <div className="max-h-72 overflow-y-auto custom-scrollbar">
                                {!(safeEnrollments[currentUserUid]?.notifications?.length) ? (
                                   <div className="p-6 text-center text-slate-400 text-sm">Belum ada notifikasi.</div>
                                ) : (
                                   safeEnrollments[currentUserUid].notifications.map((notif, idx) => (
                                      <div key={idx} className={`p-4 border-b border-slate-50 dark:border-slate-800/50 ${notif.read ? 'opacity-60' : 'bg-blue-50/50 dark:bg-blue-900/10'}`}>
                                         <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">{notif.text}</p>
                                         <span className="text-[10px] font-bold text-slate-400 mt-2 block">{new Date(notif.time).toLocaleString('id-ID')}</span>
                                      </div>
                                   ))
                                )}
                             </div>
                         </div>
                    )}
                  </div>
                )}
                
                <button onClick={() => setDarkMode(!darkMode)} className="p-2 text-slate-500 hover:text-blue-600 bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 rounded-full transition-colors mr-1">
                  {darkMode ? <Sun size={18} /> : <Moon size={18} />}
                </button>
                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-500 text-white flex items-center justify-center font-bold text-sm shadow-inner overflow-hidden">
                   {usersData[currentUserToken]?.photoUrl ? (
                       <img src={usersData[currentUserToken].photoUrl} alt="Profil" className="w-full h-full object-cover" />
                   ) : (
                       userName.charAt(0)
                   )}
                </div>
              </div>
            </header>
            <div className="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar bg-slate-50 dark:bg-[#0B1120]">{renderContent()}</div>
          </main>
        </div>
        </ThemeContext.Provider>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
